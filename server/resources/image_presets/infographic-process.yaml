name: infographic-process
kind: image
description: 步骤流程型信息图，适合操作指南和方法论展示
version: "1.0"
archetype: infographic
primary_use_case: infographic
recommended_aspect_ratios:
  - 3:4
  - 16:9
default_aspect_ratio: "3:4"
tags:
  - infographic
  - process
  - workflow
  - steps
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张步骤流程型信息图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点（步骤内容）：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 用清晰的步骤编号、箭头和路径组织信息，阅读顺序一目了然
  2. 读者能快速理解操作流程的全貌和先后关系
  3. 适合教程、操作指南、工作流、方法论拆解

  布局结构：
  1. 采用自上而下、从左到右或蛇形（S 形）阅读路径
  2. 每个步骤用独立区块或卡片承载，带有序号标记
  3. 步骤之间用箭头、连接线或路径引导阅读方向
  4. 起始步骤和最终结果要有明确的视觉标识
  5. 可以在起始处放标题，在结尾处放总结或预期成果

  视觉设计：
  1. 步骤卡片保持统一的大小和间距，体现秩序感
  2. 序号标记醒目（圆形数字、色块数字或图标编号）
  3. 箭头和连接线简洁明确，不要花哨的装饰性路径
  4. 可以用渐变色或色相递变来暗示步骤的推进
  5. 每个步骤可以配有简明的小图标来增强理解

  信息密度控制：
  1. 步骤数量建议 4-7 个，太多需要拆分为多张图
  2. 每个步骤的描述控制在 2-3 行以内
  3. 核心动作用粗体或高亮强调
  4. 如果有注意事项或提示，用小标注或图标区分
  5. 不要在每个步骤里放过多子步骤

  负向约束：
  1. 不要让流程路径产生歧义，每个步骤只有一条前进方向
  2. 不要步骤卡片大小不一导致视觉混乱
  3. 不要用密集的箭头和连线让画面变成蜘蛛网
  4. 不要在步骤描述中使用长段落，信息图不是文章
  5. 不要使用写实照片作为步骤配图
  6. 不要忽略最终步骤或结果的可视化展示
