name: infographic-timeline
kind: image
description: 时间线和里程碑型信息图，适合发展历程和阶段梳理
version: "1.0"
archetype: infographic
primary_use_case: infographic
recommended_aspect_ratios:
  - 3:4
  - 16:9
default_aspect_ratio: "3:4"
tags:
  - infographic
  - timeline
  - milestones
  - chronology
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张时间线型信息图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点（时间节点和事件）：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 按时间顺序清晰展示关键节点和里程碑
  2. 读者能快速理解事件的发展脉络和节奏
  3. 适合发展历程、项目路线图、行业演进、个人成长轨迹

  布局结构：
  1. 采用垂直或水平时间轴线作为骨架
  2. 关键节点用圆点、图标或标记标注在时间轴上
  3. 每个节点配有简短的时间标签和事件描述
  4. 时间标签（年份/日期）必须清晰醒目
  5. 事件描述控制在 1-2 行，言简意赅

  视觉设计：
  1. 时间轴线用简洁的直线或微妙的曲线，不要花哨
  2. 节点标记大小可以有变化，重要节点更大或用强调色
  3. 可以在节点旁使用小图标来增强语义（如里程碑用旗帜、起点用星星）
  4. 背景保持简洁，不要干扰时间线的阅读
  5. 配色统一，不同阶段可以用不同色相区分，但整体和谐

  信息组织：
  1. 时间节点数量建议 4-8 个，太多会让图面拥挤
  2. 每个节点只保留最重要的信息，不要堆砌细节
  3. 如果有明确的阶段划分，可以用色块或背景区分不同阶段
  4. 重要的转折点或突破性事件要视觉强调

  交互引导：
  1. 可以在起始点标注"起点"或"开始"
  2. 可以在终点标注当前状态或未来展望
  3. 用箭头或渐变暗示时间方向和未来延伸

  负向约束：
  1. 不要让时间轴变成密集的数据表格
  2. 不要使用过于复杂的分支或交叉结构
  3. 不要节点间距不均匀导致阅读节奏混乱
  4. 不要忽略时间标签的可读性，时间信息是核心
  5. 不要使用写实照片作为节点装饰
