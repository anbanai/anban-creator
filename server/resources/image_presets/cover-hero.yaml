name: cover-hero
kind: image
description: 强视觉冲击力的英雄型封面，适合重要观点和重磅文章
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 16:9
default_aspect_ratio: "16:9"
tags:
  - cover
  - hero
  - impact
  - strong-visual
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张具有强烈视觉冲击力的英雄型封面图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 单一强视觉锚点，主体元素清晰、明确、有力量感
  2. 画面必须在缩略图尺寸下仍具辨识度和吸引力
  3. 通过光影、构图、色彩营造戏剧性张力和高级感
  4. 适合科技趋势、商业观点、行业重磅文章

  构图要求：
  1. 采用中心构图或三分法构图，主体位于视觉重心
  2. 背景简洁但不空洞，通过渐变、光晕或几何线条增加层次
  3. 画面右半部分保留文字叠加区域（约 40% 宽度）
  4. 景深控制得当，主体锐利、背景柔化
  5. 可以使用强烈的明暗对比增强视觉张力

  色彩与质感：
  1. 配色大胆但克制，不超过 3 种主色相
  2. 鼓励使用高对比度配色方案（深底亮元素或亮底深元素）
  3. 材质质感要高端，避免廉价塑料感或合成感
  4. 允许使用微妙的光效和粒子增加氛围

  负向约束：
  1. 不要元素堆砌拥挤，英雄型封面核心是"少即是精"
  2. 不要低饱和灰蒙蒙的画面，要有明确的主色调
  3. 不要赛博朋克、霓虹灯、高饱和撞色风格
  4. 不要卡通插画、像素风格、游戏感
  5. 不要加入二维码、logo 水印、日期等杂乱元素
  6. 不要整段文字出现在画面上，只保留标题安全区
