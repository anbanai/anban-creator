name: cover-default
kind: image
description: 通用文章封面，安全百搭，适合大多数公众号图文
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 16:9
default_aspect_ratio: "16:9"
tags:
  - cover
  - default
  - versatile
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张通用封面图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计要求：
  1. 画幅为 16:9 横版封面，适配微信公众号首图尺寸
  2. 画面中心或右侧保留文字标题的安全区域，确保标题可读
  3. 主题聚焦，视觉锚点明确，一眼能看出文章大致方向
  4. 背景与主体元素和谐统一，避免杂乱堆砌
  5. 配色大方得体，适合社交传播场景
  6. 优先使用图像叙事，避免大段文字堆砌在画面上

  构图原则：
  1. 主体元素占据画面 60%-70%，留白用于标题区域
  2. 可以使用渐变背景、几何元素或实景照片作为基底
  3. 光影自然，不要过度 HDR 或滤镜感
  4. 整体风格现代、干净、专业

  负向约束：
  1. 不要低分辨率素材感、不要水印、不要二维码
  2. 不要过度饱和的色彩、不要廉价渐变
  3. 不要复杂密集的文字排版，封面图不是信息图
  4. 不要真人露脸特写（除非与文章主题直接相关）
  5. 不要卡通 Q 版风格，保持专业感
