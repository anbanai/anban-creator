name: cover-editorial
kind: image
description: 杂志编辑风格封面，强版式感，适合深度评论和行业观察
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 16:9
default_aspect_ratio: "16:9"
tags:
  - cover
  - editorial
  - magazine
  - premium
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张具有杂志封面编辑质感的封面图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 画面呈现高端杂志封面的版式感和编辑审美
  2. 强调整体构图的高级感和专业权威感
  3. 适合深度评论、行业观察、人物专访、年度总结等严肃内容
  4. 让读者在社交媒体信息流中感受到"这篇文章值得认真读"

  版式与排版：
  1. 采用经典的杂志封面构图：大图 + 强排版标题 + 装饰线条
  2. 标题区域要有明确的版式设计感，不是简单的文字叠加
  3. 可以使用分割线、色块、边框等编辑元素增强版式感
  4. 标题、副标题、标签之间的层级关系要清晰明确
  5. 留白是设计的一部分，不要填满每一个像素

  视觉质感：
  1. 图像质感要接近高端商业摄影或精致插画
  2. 配色沉稳大气，推荐低饱和度或单色调方案
  3. 可以使用黑白灰为主调，用少量点缀色突出重点
  4. 整体画面要有印刷品质感，像高端杂志纸面上的效果
  5. 适当使用纹理或纸张质感增加真实感

  负向约束：
  1. 不要社交媒体快消风格（大字报、荧光色、弹窗感）
  2. 不要电商促销海报风格（打折标签、倒计时、弹框）
  3. 不要过度设计的科技发布会风格，保持编辑感而非科技感
  4. 不要使用多个不相关的图像拼贴
  5. 不要画面中出现英文大段文字（中文内容为主）
  6. 不要模糊或低对比度的背景导致标题无法阅读
