name: cover-minimal
kind: image
description: 极简留白风格封面，安静克制，适合个人品牌和理念类文章
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 16:9
default_aspect_ratio: "16:9"
tags:
  - cover
  - minimal
  - clean
  - zen
  - calm
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张极简留白风格的封面图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 画面极致简洁，用最少的元素传达最精准的氛围
  2. 留白是画面的主角，呼吸感是核心设计语言
  3. 适合个人成长、生活美学、品牌理念、内省感悟类文章
  4. 让读者在喧嚣的信息流中感受到"停下来深呼吸"的宁静

  极简原则：
  1. 画面元素不超过 3 个（含背景），能少则少
  2. 可以使用一个核心几何图形、一根线条、一朵花、一抹光
  3. 背景推荐使用大面积纯净色或极微妙渐变
  4. 主体元素要精致、有质感，因为是唯一的视觉焦点
  5. 构图讲究平衡感，可以不对称但要稳定

  色彩控制：
  1. 整体不超过 2 种色相，推荐单色调或近似色方案
  2. 鼓励使用低饱和度色彩或莫兰迪色系
  3. 白色、米色、浅灰色作为大面积基调色
  4. 如果有点缀色，占比控制在 5% 以内
  5. 整体色调传达安静、克制、优雅、可信赖的情绪

  文字区域：
  1. 标题区域占据画面至少 40%，文字是画面的重要组成部分
  2. 文字排布简洁有力，不需要花哨的装饰
  3. 可以只放标题，不需要摘要或标签

  负向约束：
  1. 不要任何装饰性元素（边框、线条、图标），除非它是核心设计元素
  2. 不要渐变、光效、粒子等"加法"视觉效果
  3. 不要写实照片、人像、复杂场景
  4. 不要使用超过 2 种字体大小
  5. 不要卡通、手绘、涂鸦风格
  6. 不要任何看起来"努力设计过"的痕迹，极简的核心是克制
