name: infographic-comparison
kind: image
description: 左右或上下对比型信息图，适合方案比较和优缺点分析
version: "1.0"
archetype: infographic
primary_use_case: infographic
recommended_aspect_ratios:
  - 3:4
  - 16:9
default_aspect_ratio: "3:4"
tags:
  - infographic
  - comparison
  - contrast
  - versus
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张对比型信息图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点（对比双方的内容）：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 清晰的左右或上下对比结构，让读者一眼看出差异
  2. 每一侧的信息并列对齐，便于快速扫描比较
  3. 适合 A/B 对比、方案比较、before/after、优缺点分析

  布局结构：
  1. 顶部或中央放置标题，明确指出对比主题（如"A 方案 vs B 方案"）
  2. 采用中轴对称或左右均分的布局，两侧内容严格对齐
  3. 每个对比维度使用独立的行或区块，带有对比标签
  4. 可以使用 VS 标识、分隔线或中轴色带来强化对比感
  5. 关键差异点可以用颜色或图标高亮标记

  视觉设计：
  1. 两侧使用不同但和谐的配色，便于视觉区分
  2. 对比标签（如"优点"/"缺点"、"方案A"/"方案B"）要醒目
  3. 每个维度的对比内容尽量简洁，控制在 1-2 行
  4. 可以使用对勾、叉号、箭头、星级等符号辅助对比
  5. 底部可以添加总结性结论或推荐

  信息组织：
  1. 对比维度不宜过多，建议 3-6 个核心维度
  2. 每个维度的描述要简洁有力，不要长段落
  3. 如果有量化数据，优先用数据说话
  4. 对比逻辑要清晰，不要罗列无关维度的差异

  负向约束：
  1. 不要让一侧内容远多于另一侧，保持视觉平衡
  2. 不要使用超过 3 种颜色，避免彩虹色对比
  3. 不要把整篇文章的文字都塞进图里，只取核心对比内容
  4. 不要模糊不清的小字，所有文字在手机屏幕上要可读
  5. 不要使用写实照片拼贴，保持扁平化或半扁平化风格
