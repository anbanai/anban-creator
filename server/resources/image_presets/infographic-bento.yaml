name: infographic-bento
kind: image
description: Bento Grid 模块化信息图，适合多维度内容总览
version: "1.0"
archetype: infographic
primary_use_case: infographic
recommended_aspect_ratios:
  - 3:4
  - 16:9
default_aspect_ratio: "3:4"
tags:
  - infographic
  - bento
  - grid
  - overview
  - modular
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张 Bento Grid 模块化信息图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 采用 Bento（便当盒）网格布局，将多个信息模块组织在统一的网格中
  2. 每个模块承载一个独立的信息点，模块之间层级分明、留白明确
  3. 适合多主题综述、内容总览、知识体系梳理、多维度分析

  布局结构：
  1. 整体采用网格化布局，模块之间有统一的间距（建议 8-16px）
  2. 不同模块可以有不同的大小（1x1、2x1、1x2、2x2），根据内容重要性分配
  3. 最重要的模块（通常是标题或核心结论）占据最大面积
  4. 模块排列要错落有致，不要机械的等分网格
  5. 所有模块的外边缘对齐，形成整齐的画框感

  模块设计：
  1. 每个模块有独立的浅色背景或微妙边框，形成视觉分区
  2. 模块内可以包含：标题、简短描述、关键数据、小图标或迷你图表
  3. 数据型模块优先展示数字和百分比，辅以简短说明
  4. 描述型模块控制在 2-3 行文字以内
  5. 每个模块的圆角保持一致，建议使用 12-16px

  视觉质感：
  1. 整体风格现代、扁平、干净，接近 Apple 或 Notion 的设计语言
  2. 模块背景推荐使用浅灰、米白或低饱和度的柔和色彩
  3. 可以在个别模块中使用强调色作为背景突出重要性
  4. 图标风格统一（建议线性图标），不要混搭不同风格
  5. 字体层级清晰：模块标题 > 核心数据 > 辅助说明

  负向约束：
  1. 不要模块过多导致画面拥挤，建议 5-9 个模块
  2. 不要所有模块大小一样，需要有主次之分
  3. 不要在模块内放长段落文字，每个模块必须简洁
  4. 不要使用写实照片填充模块
  5. 不要模块之间的间距不一致或对齐混乱
  6. 不要使用超过 4 种模块背景色
