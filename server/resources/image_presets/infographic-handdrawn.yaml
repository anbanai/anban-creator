name: infographic-handdrawn
kind: image
description: 手绘 Sketchnote 风格信息图，温暖亲切，适合教程和知识总结
version: "1.0"
archetype: infographic
primary_use_case: infographic
recommended_aspect_ratios:
  - 3:4
  - 4:5
  - 16:9
default_aspect_ratio: "3:4"
tags:
  - infographic
  - sketchnote
  - handdrawn
  - warm
  - educational
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张手绘 Sketchnote 风格的信息图。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 采用手绘笔记风格（Sketchnote），像精心整理的视觉笔记
  2. 图文并茂，每个要点都配有手绘小图标、箭头或简笔插图
  3. 传达温暖、亲切、有温度的知识分享感
  4. 适合方法论总结、教程步骤、知识概览、读书笔记

  手绘质感：
  1. 线条自然但清晰，允许轻微不规则感体现手绘温度
  2. 整体像用黑色签字笔在纸张上绘制，可以搭配少量马克笔上色
  3. 背景推荐白纸、浅米色或方格纸质感
  4. 文字呈现手写体或圆润印刷体风格
  5. 图标和插图要简洁明快，不是写实插画

  排版与信息组织：
  1. 主标题醒目，像用粗马克笔手写的大标题
  2. 信息以多个手绘"区块"组织，每个区块用便签框、云朵框或手绘边框围起来
  3. 使用箭头、连线、圈注、星号来建立信息之间的关系
  4. 视觉流向清晰，让读者沿着图文结构自然阅读
  5. 图和文互相解释，图标不只是装饰，要有语义

  色彩使用：
  1. 主色调为黑白线条，点缀色不超过 3 种
  2. 点缀色使用马克笔质感：温和的红、蓝、绿、橙
  3. 颜色用于高亮关键词、区分不同信息模块、标记重点
  4. 不要大面积填色，保持纸面留白

  负向约束：
  1. 不要写实插画、3D 渲染或复杂阴影
  2. 不要照片拼贴或素材叠加
  3. 不要把整篇文章的文字搬进图里，只取核心要点
  4. 不要使用过于幼稚的蜡笔涂鸦风格
  5. 不要密集到无法阅读，手绘图也要保持可读性
  6. 不要使用发光、渐变、粒子等数字效果
