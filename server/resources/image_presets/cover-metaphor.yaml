name: cover-metaphor
kind: image
description: 用视觉隐喻表达抽象主题的封面，适合方法论和认知类文章
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 16:9
default_aspect_ratio: "16:9"
tags:
  - cover
  - metaphor
  - abstract
  - conceptual
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEY_POINTS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为微信公众号文章生成一张视觉隐喻型封面图，用象征性图像表达抽象概念。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 核心要点：{{KEY_POINTS}}
  - 视觉风格：{{VISUAL_STYLE}}
  - 画幅比例：{{ASPECT_RATIO}}

  设计目标：
  1. 选择一个恰当的象征物或场景来可视化表达文章核心观点
  2. 隐喻必须直觉易懂，读者能在 2 秒内理解画面含义
  3. 不要过于晦涩或需要大量解释才能理解的意象
  4. 适合认知升级、方法论、管理策略、心理学等抽象话题

  隐喻创作原则：
  1. 优先选择具有普遍文化认知的象征符号（如灯塔=指引、桥梁=连接、钥匙=解锁）
  2. 可以使用自然意象（山川、海洋、星空、树木）来表达成长、探索、格局
  3. 允许适度超现实或艺术化处理，但整体仍需清晰传达含义
  4. 隐喻与文章主题之间要有直接的逻辑关联，不要牵强附会

  构图与氛围：
  1. 画面构图大气、有纵深感，营造思考空间
  2. 色调偏沉稳或温暖，避免冷峻科技感（除非文章确实是科技主题）
  3. 光线运用要讲究，可以用逆光、侧光增加画面的哲学氛围
  4. 右侧或下半部分保留标题叠加区域
  5. 整体画面要有"让人停下来想一秒"的视觉吸引力

  负向约束：
  1. 不要使用过于具体的场景（如办公室、会议室）替代隐喻
  2. 不要用 emoji 风格的简单图形符号堆砌
  3. 不要生成多元素拼贴，隐喻型封面需要一个核心意象
  4. 不要文字游戏或双关图，封面图要跨越语言障碍
  5. 不要低质量 AI 生成的常见套路图（如双手托举地球）
  6. 不要超写实照片风格，保持艺术化和概念化的质感
