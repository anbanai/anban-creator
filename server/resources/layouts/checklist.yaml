name: checklist
category: conversion
serves: [readability, conversion]
description: 检查清单模块，用于展示可勾选的任务列表或验证项目
position: body
when_to_use: |
  需要展示发布前检查项、执行清单、验证步骤或收藏型内容时使用。
  适合操作规范、上线核对、行动步骤验证、学习清单。
  让读者可以逐项对照检查。
when_not_to_use: |
  纯步骤流程说明用 steps 模块。
  问答类内容用 FAQ 格式。
  清单项超过 10 个时考虑分组。
  所有项都是同一状态时失去检查清单的意义。
pairs_well_with: [steps, callout, comparison-table, summary]
fields:
  required:
    - name: title
      description: 检查清单标题
      example: "发布前检查清单"
  optional:
    - name: items
      description: 检查条目列表，每项包含状态和内容
      example: "已完成 | 标题控制在 20 字以内"
example: |
  ## 文章发布前检查清单

  - [x] **标题**：控制在 20 字以内，包含核心关键词
  - [x] **封面图**：尺寸 900x383，视觉清晰不模糊
  - [x] **摘要**：120 字以内，说清文章价值
  - [ ] **排版检查**：手机预览无乱码、无溢出
  - [ ] **链接检查**：所有外链可正常打开
  - [x] **标签设置**：添加 2-3 个相关标签
  - [ ] **定时发布**：选择阅读高峰时段推送

  ---

  也可以用分组方式组织：

  ## 内容质量检查

  - [x] 核心观点是否有数据支撑
  - [x] 是否有明确的行动建议
  - [ ] 是否经过同行审阅

  ## 排版格式检查

  - [x] 段落不超过 4 行
  - [x] 小标题层次清晰
  - [ ] 图片是否全部加载正常

  ---

  **实际效果说明：**
  - 标题使用二级标题
  - 每项用 Markdown 任务列表语法（- [x] 或 - [ ]）
  - 检查项关键词加粗
  - 支持分组（多个子标题）
  - 用分隔线收尾
markdown_syntax: |
  ## 检查清单标题

  - [x] **分类**：已完成的检查项说明
  - [x] **分类**：已完成的检查项说明
  - [ ] **分类**：待完成的检查项说明
  - [ ] **分类**：待完成的检查项说明

  ---

  [x] 表示已完成，[ ] 表示未完成。
  每项开头用加粗的分类词方便快速扫描。
  建议已完成项和未完成项混合展示，增强真实感。
