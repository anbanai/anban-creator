name: metrics
category: memorability
serves: [attention, memorability]
description: 核心数据展示，用于突出呈现关键指标和数字
position: body
when_to_use: |
  需要展示关键数字、增长数据、对比指标或核心 KPI 时使用。
  适合数据报告、增长复盘、方案效果展示、行业数据引用。
  用数字说话，让核心指标一目了然。
when_not_to_use: |
  只有一个数字时，直接在正文中强调即可。
  多维度对比分析用 comparison-table 模块。
  数据来源不明确或数据过于陈旧时不要使用。
  数字需要上下文才能理解时，应配合文字说明。
pairs_well_with: [quote, summary, timeline, callout]
fields:
  required:
    - name: title
      description: 数据区域标题
      example: "核心数据"
  optional:
    - name: items
      description: 数据条目，每项包含指标名称、数值和说明
      example: "用户增长 | 300% | 同比去年增长三倍"
example: |
  ## 核心数据

  | 指标 | 数值 | 说明 |
  |------|------|------|
  | 用户增长 | **300%** | 同比去年增长三倍 |
  | 内容产出 | **120 篇** | 月均产出 10 篇原创文章 |
  | 阅读完成率 | **68%** | 远超行业平均 32% |
  | 涨粉转化率 | **5.2%** | 每篇文章平均带来 200+ 新粉 |

  ---

  也可以用卡片式展示关键指标：

  **300%** -- 用户增长（同比去年）

  **68%** -- 阅读完成率（行业平均 32%）

  **5.2%** -- 涨粉转化率（每篇 200+ 新粉）

  ---

  **实际效果说明：**
  - 标题使用二级标题
  - 表格模式：标准 Markdown 表格，数值列加粗
  - 卡片模式：每行一个指标，"**数值** -- 指标名称（说明）"
  - 用分隔线收尾
markdown_syntax: |
  方式一：表格模式（适合 4 个以上指标）

  ## 数据标题

  | 指标 | 数值 | 说明 |
  |------|------|------|
  | 指标名 | **数值** | 说明文字 |
  | 指标名 | **数值** | 说明文字 |

  方式二：卡片模式（适合 3 个以内关键指标）

  ## 数据标题

  **数值** -- 指标名称（说明）

  ---

  数值建议简洁（如 300%、120 篇），避免冗长表述。
  说明文字补充背景，帮助读者理解数字的意义。
