name: steps
category: readability
serves: [readability]
description: 分步骤流程展示，用于拆解操作流程、方法论或执行顺序
position: body
when_to_use: |
  需要展示操作步骤、方法论流程、落地执行顺序时使用。
  适合教程拆解、操作说明、方法论介绍、工作流程说明。
  当步骤之间有明确的先后顺序关系时最适合。
when_not_to_use: |
  步骤之间没有先后顺序时，用普通列表即可。
  带图片的步骤演示用图文混排更合适。
  时间线演进用 timeline 模块。
  每个步骤内容超过 200 字时，应拆为独立章节。
pairs_well_with: [callout, checklist, toc, comparison-table]
fields:
  required:
    - name: title
      description: 步骤区域标题
      example: "落地步骤"
  optional:
    - name: steps
      description: 步骤列表，每步包含序号、标题和说明
      example: "01 | 先给结果判断 | 不要先讲背景和过程"
example: |
  ## 操作步骤

  ### 01 明确目标

  先确定你要解决什么问题，把核心目标用一句话写下来。
  不要急着动手，方向比速度更重要。

  ### 02 拆解任务

  把大目标拆成 3-5 个可执行的小任务。
  每个任务的标准：能在一个番茄钟内完成。

  ### 03 逐个击破

  按优先级从高到低依次执行。
  每完成一个任务就做一次检查。

  ### 04 复盘优化

  回顾整个过程，记录哪些做得好、哪些可以改进。
  把经验固化为下次可以直接用的模板。

  ---

  **实际效果说明：**
  - 步骤区域使用二级标题
  - 每个步骤使用三级标题，序号+标题（动词开头）
  - 步骤说明用正文段落
  - 用分隔线收尾
markdown_syntax: |
  ## 区域标题

  ### 序号 步骤标题（动词开头）

  步骤说明正文，解释具体怎么做。

  ### 序号 步骤标题

  步骤说明正文。

  ---

  序号建议用两位数（01、02），标题用动词开头（明确、拆解、执行）。
  每个步骤说明控制在 2-4 句话。
