name: cta
category: conversion
serves: [conversion]
description: 行动号召模块，用于引导读者在文章结尾采取下一步行动
position: body
when_to_use: |
  文章结尾需要引导读者采取具体行动时使用。
  适合引导关注、收藏、转发、试用产品、扫码加入社群等。
  任何需要读者"读完之后做什么"的场景。
when_not_to_use: |
  纯信息分享类文章不强制需要 CTA。
  中间章节过渡不需要 CTA，那是正文衔接的工作。
  多个 CTA 会让读者选择困难，一篇文章最多一个主 CTA。
  CTA 没有明确的行动目标时不要使用。
pairs_well_with: [summary, author-card, checklist]
fields:
  required:
    - name: title
      description: 行动引导主文案，说明为什么读者应该采取行动
      example: "觉得有用？点赞收藏，下次写文章直接用"
  optional:
    - name: note
      description: 底部说明或品牌语
      example: "每天进步一点点"
    - name: link
      description: 跳转链接文字说明
      example: "点击这里查看完整工具清单"
example: |
  ---

  ### 觉得有用？

  如果这篇文章帮你理清了写作思路，**点个赞、收藏一下**，下次写文章直接翻出来参考。

  也欢迎**转发给正在纠结排版的朋友**，让好内容被更多人看到。

  *每天进步一点点。*

  ---

  **实际效果说明：**
  - 用分隔线与正文隔开
  - 标题用三级标题（疑问句更有引导感）
  - 正文包含 1-2 个具体行动建议，关键词加粗
  - 底部用斜体展示品牌语/签名
  - 用分隔线收尾
markdown_syntax: |
  ---

  ### 引导性问题或标题？

  行动引导文案，**关键词加粗**突出。

  第二个行动建议，**关键词加粗**。

  *底部品牌语或签名。*

  ---

  CTA 标题建议用疑问句（"觉得有用？"、"还想了解更多？"）。
  行动建议具体明确，告诉读者"做什么"和"为什么做"。
  一篇文最多一个主 CTA，避免让读者选择困难。
