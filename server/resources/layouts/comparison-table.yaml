name: comparison-table
category: readability
serves: [readability, attention]
description: 方案对比表格，用于并排展示不同方案的优缺点或特性差异
position: body
when_to_use: |
  需要对比 2-4 个方案、产品或选择的优缺点时使用。
  适合选型分析、方案评估、产品对比、技术选型文章。
  帮助读者快速做出决策判断。
when_not_to_use: |
  纯数据指标对比用 metrics 模块。
  单一维度的简单对比用普通列表即可。
  对比项超过 5 个时，表格会过宽影响阅读，考虑分表。
  每个方案的描述超过 50 字时，考虑用分章节展开。
pairs_well_with: [steps, quote, summary, callout]
fields:
  required:
    - name: title
      description: 对比表格的标题
      example: "三种方案对比"
  optional:
    - name: dimension
      description: 对比维度列表，作为表格的行标题
      example: "上手难度、成本、扩展性"
    - name: conclusion
      description: 对比结论，放在表格后总结推荐方案
      example: "推荐方案 B，性价比最高"
example: |
  ## 自建团队 vs 外包 vs SaaS 工具

  | 维度 | 自建团队 | 外包 | SaaS 工具 |
  |------|---------|------|----------|
  | 上手成本 | 高（招聘+培训） | 中（沟通成本） | **低（即开即用）** |
  | 月均费用 | 2-5 万 | 1-3 万/项目 | 99-999 元/月 |
  | 定制能力 | 完全可控 | 按需定制 | 受限于平台 |
  | 响应速度 | 快（内部协作） | 依赖乙方 | 快（自助操作） |
  | 质量把控 | 需要专人管理 | 需要验收流程 | 平台标准化 |

  **结论：** 如果月预算在 5000 元以内且追求效率，SaaS 工具是最优选择。预算充足且有长期需求时，考虑自建团队。

  ---

  **实际效果说明：**
  - 标题用二级标题
  - 使用 Markdown 标准表格语法
  - 第一行为表头（维度 + 各方案名称）
  - 推荐项用加粗标注
  - 结论放在表格下方
  - 用分隔线收尾
markdown_syntax: |
  ## 对比标题

  | 维度 | 方案A | 方案B | 方案C |
  |------|-------|-------|-------|
  | 维度1 | 说明 | **推荐说明** | 说明 |
  | 维度2 | 说明 | 说明 | 说明 |

  **结论：** 简要说明推荐哪个方案及原因。

  ---

  建议对比方案不超过 4 个、维度不超过 6 个。
  在最适合的选项上用加粗突出。
