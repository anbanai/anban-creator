name: summary
category: conversion
serves: [memorability, readability]
description: 核心要点总结，用于章节末尾或文章结尾帮助读者快速回顾关键信息
position: body
when_to_use: |
  章节末尾或文章结尾需要帮读者带走最重要的判断或要点时使用。
  适合长文的阶段性小结、文章结尾的核心结论。
  让读者"读完之后能记住一句话"。
when_not_to_use: |
  内容本身就很短不需要总结。
  需要详细展开的结论应写为正文段落。
  多项待办事项用 checklist 更合适。
  总结内容与正文重复时没有存在价值。
pairs_well_with: [cta, quote, metrics, author-card]
fields:
  required:
    - name: highlight
      description: 核心判断，一句话总结最重要的结论
      example: "先把结构搭稳，再让主题接管气质"
  optional:
    - name: label
      description: 标签词（如"一句话总结"、"核心要点"）
      example: "一句话总结"
    - name: points
      description: 多条关键要点，用于展开说明
      example: "结构先于风格 | 模块服务阅读 | 主题定义气质"
example: |
  ## 一句话总结

  **先把结构搭稳，再让主题接管气质。**

  ---

  也可以展开为多条要点：

  ## 核心要点

  1. **结构先于风格** -- 先搭好内容骨架，再考虑视觉呈现
  2. **模块服务阅读** -- 每个模块都有明确的阅读功能，不为排版而排版
  3. **主题定义气质** -- 同一篇内容切换主题，传递完全不同的感觉
  4. **数据支撑判断** -- 用具体数字代替模糊描述，增强说服力

  ---

  也可以用卡片式展示：

  ## 写在最后

  > **三件事决定你的公众号文章质量：**
  > 读者 3 秒内能否判断要不要读完、阅读过程中是否觉得清晰、读完之后能不能记住一个结论。
  > 排版结构解决的就是这三个问题。

  ---

  **实际效果说明：**
  - 标签用二级标题
  - 一句话总结模式：加粗 + 独立段落
  - 多要点模式：有序列表，每项关键词加粗 + 破折号说明
  - 引用卡片模式：引用块 + 加粗强调
  - 用分隔线收尾
markdown_syntax: |
  方式一：一句话总结

  ## 标签
  **核心判断一句话。**

  方式二：多条要点

  ## 标签
  1. **要点关键词** -- 简要说明
  2. **要点关键词** -- 简要说明
  3. **要点关键词** -- 简要说明

  ---

  一句话总结控制在 20 字以内，多用判断句。
  多条要点建议 3-5 条，每条说明一句话。
