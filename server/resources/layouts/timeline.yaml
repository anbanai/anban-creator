name: timeline
category: readability
serves: [readability]
description: 时间线/阶段展示，用于呈现按时间或阶段顺序排列的演进过程
position: body
when_to_use: |
  需要展示时间演进、产品迭代、历史梳理、多阶段规划时使用。
  适合产品发展历程、行业变化回顾、项目规划路线图。
  与 steps 的区别：timeline 强调时序和演进，steps 强调动作和执行。
when_not_to_use: |
  操作步骤流程用 steps 更合适。
  版本更新日志用 changelog 格式。
  阶段之间没有时间关系时用普通列表。
  时间节点超过 7 个时，考虑分组或拆分为多段。
pairs_well_with: [metrics, quote, steps, summary]
fields:
  required:
    - name: title
      description: 时间线区域标题
      example: "产品演进路线"
  optional:
    - name: items
      description: 时间线条目，每个包含时间标签、事件标题和说明
      example: "2024-Q1 | 1.0 发布 | 基础功能上线"
example: |
  ## 产品演进路线

  **2024-Q1 | 1.0 版本发布**

  基础排版功能上线，支持 Markdown 转微信公众号格式。
  解决了"复制粘贴排版丢失"的核心痛点。

  **2024-Q3 | 2.0 主题系统**

  引入主题系统，一套内容可以切换不同视觉风格。
  新增 6 套内置主题，覆盖科技、商务、文艺等场景。

  **2025-Q1 | 3.0 智能排版**

  加入 AI 驱动的智能排版能力。
  支持自动识别内容结构并推荐合适的排版模块。

  **2025-Q4 | 4.0 生态整合**（规划中）

  开放插件系统，支持第三方模块扩展。
  计划接入更多内容平台和发布渠道。

  ---

  **实际效果说明：**
  - 时间线标题使用二级标题
  - 每个节点用"**时间 | 事件**"格式，加粗显示
  - 节点说明用正文段落
  - 未来/规划中的节点可在括号中标注状态
  - 用分隔线收尾
markdown_syntax: |
  ## 时间线标题

  **时间标签 | 事件标题**

  事件说明正文，补充背景或意义。

  **时间标签 | 事件标题**

  事件说明正文。

  ---

  时间标签格式建议：年-月（2025-01）、年-季度（2025-Q1）或阶段名（第一阶段）。
  每个节点说明控制在 1-3 句话。
