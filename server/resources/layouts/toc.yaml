name: toc
category: attention
serves: [readability]
description: 文章阅读导航目录，帮助读者快速了解文章结构和各章节内容
position: body
when_to_use: |
  长文（3 个章节以上）开头给读者提供阅读路径时使用。
  帮助读者快速判断哪部分和自己最相关。
  适合教程、深度分析、综合报告类文章。
when_not_to_use: |
  短文（2 个章节以内）不需要目录，直接开始正文。
  信息流型文章（每日速递、碎片化内容）不需要导航。
  目录放在文章中间或结尾没有意义。
pairs_well_with: [hero, steps, summary, author-card]
fields:
  required:
    - name: title
      description: 目录区域的标题
      example: "阅读导航"
  optional:
    - name: items
      description: 目录条目列表，每项包含序号、标题和简短说明
      example: "01 | 排版结构先搭好 | 让读者知道你要讲什么"
example: |
  ## 阅读导航

  **01 | 先看模块定位** -- 这套结构解决什么问题
  **02 | 再看基础元素** -- 标题、表格、代码怎么共存
  **03 | 最后看行动区域** -- 如何把文章收得更完整
  **04 | 配套工具推荐** -- 实操可用的排版工具清单

  ---

  正文内容从这里开始...

  **实际效果说明：**
  - 目录标题使用二级标题
  - 每个条目用"序号 | 标题 -- 说明"的格式
  - 条目标题加粗突出，说明用破折号分隔
  - 用分隔线与正文隔开
markdown_syntax: |
  在文章开头（hero 之后或文章最开始）使用：

  ## 目录标题
  **01 | 章节标题** -- 一句话说明
  **02 | 章节标题** -- 一句话说明
  **03 | 章节标题** -- 一句话说明
  ---

  序号建议用两位数（01、02）保持视觉对齐。
  说明部分可省略，但建议保留以提升导航价值。
