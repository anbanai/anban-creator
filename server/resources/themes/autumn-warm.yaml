# 秋日暖光主题 — 结构化排版规格，供确定性渲染器（server/app/converter/render.go）消费。
# type: deterministic 表示该主题由确定性渲染器驱动，不再需要 LLM 提示词。
name: autumn-warm
type: deterministic
description: "【秋日暖光】温暖治愈，橙色调，文艺美学"
version: "5.0"

# 风格说明
style_info:
  mood: "温暖治愈"
  colors: "橙色调"
  best_for: "情感故事、生活随笔"

# 颜色方案
colors:
  background: "#faf9f5"        # 暖白背景（主容器）
  text: "#4a413d"              # 主文字色
  primary: "#d97758"           # 秋日暖橙（主强调色）
  secondary: "#c06b4d"         # 橙红高亮（副强调色）
  quote_background: "#fef4e7"  # 引用背景

# 字体排版
typography:
  font_family: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.75"
  letter_spacing: "0.5px"

# 容器与卡片布局（主容器 + 卡片双层结构）
layout:
  container_padding: "14px 0"      # 外层主容器内边距
  max_width: "none"                # 移动端按公众号正文容器自然铺满
  card_padding: "18px 14px"        # 卡片内边距
  section_gap: "40px"              # 卡片间垂直间距
  paragraph_margin: "0 0 16px"     # 段落间距
  border_radius: "12px"            # 卡片圆角
  card_background_color: "#ffffff" # 卡片背景
  card_background_image: "linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px)" # 米白方格纹理
  card_background_size: "20px 20px"
  card_border: "1px solid rgba(0, 0, 0, 0.05)"
  card_box_shadow: "0 10px 30px rgba(0, 0, 0, 0.04), 0 0 15px rgba(217, 119, 88, 0.4)" # 暖光阴影

# 元素样式
modules:
  h2:
    icon: "▶"
    icon_color: "#d97758"
    icon_text_shadow: "0 0 12px rgba(217, 119, 88, 0.5)"
    text_color: "#d97758"
    border_bottom: "1px dashed rgba(74, 65, 61, 0.3)"
  h3:
    text_color: "#d97758"
    border_bottom: "2px solid #d97758"
  strong:
    color: "#c06b4d"
  blockquote:
    background_color: "#fef4e7"
    border_left: "5px solid #d97758"
    box_shadow: "inset 0 0 15px rgba(217, 119, 88, 0.1)"
  hr:
    border: "none"
    height: "1px"
    background: "rgba(74, 65, 61, 0.1)"
