# 渐变活力主题 — 彩色渐变标题，年轻潮流。
name: gradient-vibrant
type: deterministic
description: "【渐变活力】彩色渐变标题，年轻潮流"
version: "5.0"

style_info:
  mood: "年轻潮流"
  colors: "渐变彩色"
  best_for: "潮流、年轻向、热点、营销"

colors:
  background: "#ffffff"
  text: "#1f2937"
  primary: "#6366f1"
  secondary: "#ec4899"
  quote_background: "#f5f3ff"

typography:
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.8"
  letter_spacing: "0.3px"

layout:
  container_padding: "36px 0"
  max_width: "790px"
  card_padding: "30px 16px"
  section_gap: "38px"
  paragraph_margin: "0 0 17px"
  border_radius: "20px"
  card_background_color: "#ffffff"
  card_background_image: ""
  card_background_size: ""
  card_border: "1px solid #ece9ff"
  card_box_shadow: "0 12px 30px rgba(99, 102, 241, 0.12)"

modules:
  h2:
    icon: "✦"
    icon_color: "#6366f1"
    icon_text_shadow: "0 0 12px rgba(99, 102, 241, 0.4)"
    text_color: "#6366f1"
    border_bottom: "3px solid #6366f1"
  h3:
    text_color: "#ec4899"
    border_bottom: "2px solid #c4b5fd"
  strong:
    color: "#7c3aed"
  blockquote:
    background_color: "#f5f3ff"
    border_left: "5px solid #6366f1"
    box_shadow: "inset 0 0 12px rgba(99, 102, 241, 0.06)"
  hr:
    border: "none"
    height: "2px"
    background: "linear-gradient(90deg, #6366f1, #ec4899)"
