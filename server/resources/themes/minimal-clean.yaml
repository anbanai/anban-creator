# 极简留白主题 — 黑白灰，大留白，克制专注。
name: minimal-clean
type: deterministic
description: "【极简留白】黑白灰，大留白，克制专注"
version: "5.0"

style_info:
  mood: "克制专注"
  colors: "黑白灰"
  best_for: "观点输出、干货、极简审美"

colors:
  background: "#ffffff"
  text: "#2b2b2b"
  primary: "#111111"
  secondary: "#6b6b6b"
  quote_background: "#f6f6f6"

typography:
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.8"
  letter_spacing: "0.3px"

layout:
  container_padding: "48px 0"
  max_width: "760px"
  card_padding: "32px 16px"
  section_gap: "40px"
  paragraph_margin: "0 0 18px"
  border_radius: "8px"
  card_background_color: "#ffffff"
  card_background_image: ""
  card_background_size: ""
  card_border: "1px solid #ececec"
  card_box_shadow: "none"

modules:
  h2:
    icon: ""
    icon_color: "#111111"
    icon_text_shadow: "none"
    text_color: "#111111"
    border_bottom: "1px solid #111111"
  h3:
    text_color: "#222222"
    border_bottom: "1px solid #e0e0e0"
  strong:
    color: "#111111"
  blockquote:
    background_color: "#f6f6f6"
    border_left: "3px solid #111111"
    box_shadow: "none"
  hr:
    border: "none"
    height: "1px"
    background: "#e6e6e6"
