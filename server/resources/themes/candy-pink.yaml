# 糖果粉主题 — 粉色圆润，活泼可爱，生活向。
name: candy-pink
type: deterministic
description: "【糖果粉】粉色圆润，活泼可爱，生活向"
version: "5.0"

style_info:
  mood: "活泼可爱"
  colors: "粉色"
  best_for: "日常分享、美食、亲子、好物"

colors:
  background: "#fff5f8"
  text: "#4a3340"
  primary: "#ec4899"
  secondary: "#f43f5e"
  quote_background: "#ffe4ee"

typography:
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.85"
  letter_spacing: "0.4px"

layout:
  container_padding: "36px 10px"
  max_width: "780px"
  card_padding: "28px 26px"
  section_gap: "36px"
  paragraph_margin: "0 0 16px"
  border_radius: "24px"
  card_background_color: "#ffffff"
  card_background_image: ""
  card_background_size: ""
  card_border: "1px solid #ffd6e7"
  card_box_shadow: "0 12px 30px rgba(236, 72, 153, 0.12)"

modules:
  h2:
    icon: "✿"
    icon_color: "#ec4899"
    icon_text_shadow: "0 0 10px rgba(236, 72, 153, 0.35)"
    text_color: "#ec4899"
    border_bottom: "2px dotted #f9a8d4"
  h3:
    text_color: "#f43f5e"
    border_bottom: "2px solid #f9a8d4"
  strong:
    color: "#db2777"
  blockquote:
    background_color: "#ffe4ee"
    border_left: "5px solid #ec4899"
    box_shadow: "inset 0 0 12px rgba(236, 72, 153, 0.08)"
  hr:
    border: "none"
    height: "2px"
    background: "#fbcfe8"
