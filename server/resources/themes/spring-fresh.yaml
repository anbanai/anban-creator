# 春日清新主题 — 结构化排版规格，供确定性渲染器（app/converter/render.go）消费。
name: spring-fresh
type: deterministic
description: "【春日清新】清新自然，绿色调，生机盎然"
version: "5.0"

# 风格说明
style_info:
  mood: "清新自然"
  colors: "绿色调"
  best_for: "旅行日记、自然主题"

# 颜色方案
colors:
  background: "#f5f8f5"        # 淡绿背景（主容器）
  text: "#3d4a3d"              # 深绿灰（主文字色）
  primary: "#6b9b7a"           # 春日嫩绿（主强调色）
  secondary: "#4a8058"         # 草地翠绿（副强调色）
  quote_background: "#e8f0e8"  # 引用背景

# 字体排版
typography:
  font_family: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.8"
  letter_spacing: "0.3px"

# 容器与卡片布局
layout:
  container_padding: "14px 0"
  max_width: "none"
  card_padding: "18px 14px"
  section_gap: "40px"
  paragraph_margin: "0 0 16px"
  border_radius: "12px"
  card_background_color: "#ffffff"
  card_background_image: "radial-gradient(circle at 1px 1px, rgba(107, 155, 122, 0.08) 1px, transparent 0)" # 清新点状纹理
  card_background_size: "20px 20px"
  card_border: "1px solid rgba(107, 155, 122, 0.1)"
  card_box_shadow: "0 8px 24px rgba(74, 128, 88, 0.08), 0 0 12px rgba(107, 155, 122, 0.2)" # 清新阴影

# 元素样式
modules:
  h2:
    icon: "❀"
    icon_color: "#6b9b7a"
    icon_text_shadow: "0 0 10px rgba(107, 155, 122, 0.4)"
    text_color: "#4a8058"
    border_bottom: "1px dashed rgba(74, 128, 88, 0.25)"
  h3:
    text_color: "#4a8058"
    border_bottom: "2px solid #6b9b7a"
  strong:
    color: "#4a8058"
  blockquote:
    background_color: "#e8f0e8"
    border_left: "5px solid #6b9b7a"
    box_shadow: "inset 0 0 12px rgba(107, 155, 122, 0.1)"
  hr:
    border: "none"
    height: "1px"
    background: "linear-gradient(90deg, transparent, rgba(107, 155, 122, 0.3), transparent)"
