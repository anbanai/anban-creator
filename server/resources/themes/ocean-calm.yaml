# 深海静谧主题 — 结构化排版规格，供确定性渲染器（server/app/converter/render.go）消费。
name: ocean-calm
type: deterministic
description: "【深海静谧】深邃冷静，蓝色调，理性专业"
version: "5.0"

# 风格说明
style_info:
  mood: "深邃静谧"
  colors: "蓝色调"
  best_for: "技术文章、商业分析"

# 颜色方案
colors:
  background: "#f0f4f8"        # 淡蓝背景（主容器）
  text: "#3a4150"              # 深蓝灰（主文字色）
  primary: "#4a7c9b"           # 深海蔚蓝（主强调色）
  secondary: "#3d6a8a"         # 静谧石蓝（副强调色）
  quote_background: "#e8f0f8"  # 引用背景

# 字体排版
typography:
  font_family: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  font_size: "16px"
  line_height: "1.8"
  letter_spacing: "0.2px"

# 容器与卡片布局
layout:
  container_padding: "12px 0"
  max_width: "none"
  card_padding: "18px 14px"
  section_gap: "40px"
  paragraph_margin: "0 0 16px"
  border_radius: "12px"
  card_background_color: "#ffffff"
  card_background_image: "linear-gradient(rgba(74, 124, 155, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(74, 124, 155, 0.03) 1px, transparent 1px)" # 淡蓝网格纹理
  card_background_size: "24px 24px"
  card_border: "1px solid rgba(74, 124, 155, 0.08)"
  card_box_shadow: "0 8px 28px rgba(58, 65, 80, 0.06), 0 0 16px rgba(74, 124, 155, 0.15)" # 深海阴影

# 元素样式
modules:
  h2:
    icon: "◆"
    icon_color: "#4a7c9b"
    icon_text_shadow: "0 0 10px rgba(74, 124, 155, 0.4)"
    text_color: "#3d6a8a"
    border_bottom: "1px dashed rgba(74, 124, 155, 0.3)"
  h3:
    text_color: "#3d6a8a"
    border_bottom: "2px solid #4a7c9b"
  strong:
    color: "#3d6a8a"
  blockquote:
    background_color: "#e8f0f8"
    border_left: "5px solid #4a7c9b"
    box_shadow: "inset 0 0 12px rgba(74, 124, 155, 0.08)"
  hr:
    border: "none"
    height: "1px"
    background: "linear-gradient(90deg, transparent, rgba(74, 124, 155, 0.25), transparent)"
