server:
  port: 8080
  public_base_url: "${ANBAN_PUBLIC_BASE_URL:-https://creator.anbanai.com}"
  tls_cert_file: "${ANBAN_SERVER_TLS_CERT_FILE}"
  tls_key_file: "${ANBAN_SERVER_TLS_KEY_FILE}"
  host: "0.0.0.0"

# Per-bucket, per-IP, per-request-path limits. Windows use Go duration syntax.
rate_limit:
  api:
    requests: ${ANBAN_RATE_LIMIT_API_REQUESTS:-300}
    window: ${ANBAN_RATE_LIMIT_API_WINDOW:-1m}
  auth:
    requests: ${ANBAN_RATE_LIMIT_AUTH_REQUESTS:-20}
    window: ${ANBAN_RATE_LIMIT_AUTH_WINDOW:-1m}
  send_code:
    requests: ${ANBAN_RATE_LIMIT_SEND_CODE_REQUESTS:-5}
    window: ${ANBAN_RATE_LIMIT_SEND_CODE_WINDOW:-10m}
  agent:
    requests: ${ANBAN_RATE_LIMIT_AGENT_REQUESTS:-300}
    window: ${ANBAN_RATE_LIMIT_AGENT_WINDOW:-1m}
  admin:
    requests: ${ANBAN_RATE_LIMIT_ADMIN_REQUESTS:-10}
    window: ${ANBAN_RATE_LIMIT_ADMIN_WINDOW:-1m}

# Article resource rollout ceiling. Keep legacy until compatibility resources
# pass canary review; MCP requests cannot exceed this setting.
article_resources:
  lifecycle_mode: legacy

logging:
  level: info

# Optional portrait interview. No browser/provider secrets or DB migration.
# All requests require login; the platform pays provider costs within Redis quotas.
# Omitting this entire section reuses the existing official DeepSeek effective
# execution profile. An explicit section (including enabled:false) overrides reuse.
# When enabled, provide the ANBAN_ONBOARDING_*_BASE_URL, *_API_KEY, and *_MODEL
# variables through the optional anban-onboarding-providers Kubernetes Secret.
onboarding:
  enabled: ${ANBAN_ONBOARDING_ENABLED:-false}
  daily_user_limit: ${ANBAN_ONBOARDING_DAILY_USER_LIMIT:-60}
  daily_global_limit: ${ANBAN_ONBOARDING_DAILY_GLOBAL_LIMIT:-1000}
  chat:
    base_url: "${ANBAN_ONBOARDING_CHAT_BASE_URL}"
    api_key: "${ANBAN_ONBOARDING_CHAT_API_KEY}"
    model: "${ANBAN_ONBOARDING_CHAT_MODEL}"
  speech:
    base_url: "${ANBAN_ONBOARDING_SPEECH_BASE_URL}"
    api_key: "${ANBAN_ONBOARDING_SPEECH_API_KEY}"
    model: "${ANBAN_ONBOARDING_SPEECH_MODEL}"

database:
  dsn: "${ANBAN_DATABASE_DSN}"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  addr: "${ANBAN_REDIS_ADDR}"
  password: "${ANBAN_REDIS_PASSWORD}"
  db: ${ANBAN_REDIS_DB:-0}

trends:
  ttl: 10m
  timeout: 8s

jwt:
  secret_key: "${ANBAN_JWT_SECRET_KEY}"
  access_expiry: "24h"
  refresh_expiry: "168h"

wechat:
  app_id: "${ANBAN_WECHAT_APP_ID}"
  app_secret: "${ANBAN_WECHAT_APP_SECRET}"

# Optional WeChat Open Platform third-party app configuration. All five values
# are required together; without them the project settings page hides QR binding.
# In Kubernetes, populate the anban-wechat-open-platform Secret described in
# docs/wechat-open-platform-setup.md. For local/Compose, set the same variables
# in the Server container environment. Generate the encryption key with
# `openssl rand -base64 32`; it accepts 32 raw bytes or base64-encoded 32 bytes.
wechat_open_platform:
  component_app_id: "${ANBAN_WECHAT_COMPONENT_APP_ID}"
  component_app_secret: "${ANBAN_WECHAT_COMPONENT_APP_SECRET}"
  message_token: "${ANBAN_WECHAT_COMPONENT_TOKEN}"
  encoding_aes_key: "${ANBAN_WECHAT_COMPONENT_ENCODING_AES_KEY}"
  token_encryption_key: "${ANBAN_WECHAT_TOKEN_ENCRYPTION_KEY}"

storage:
  provider: "oss"
  endpoint: "${ANBAN_OSS_ENDPOINT}"
  access_key_id: "${ANBAN_OSS_ACCESS_KEY_ID}"
  access_key_secret: "${ANBAN_OSS_ACCESS_KEY_SECRET}"
  bucket_name: "anbancreator"
  region: "cn-chengdu"
  # Optional public CDN/OSS custom domain only, e.g. "cdn.example.com".
  # Leave empty to return default https://{bucket}.{endpoint}/... OSS URLs.
  # Do not point this at the Studio/API domain or the /api/v1/files proxy.
  custom_domain: "${ANBAN_OSS_CDN_DOMAIN}"
  sts_role_arn: "${ANBAN_OSS_STS_ROLE_ARN}"
  sts_session_name: "anban-direct-upload"
  sts_endpoint: "${ANBAN_OSS_STS_ENDPOINT}"
  direct_upload_expires_seconds: 900
  local_data_dir: "./data/files"

mcp:
  api_key: "${ANBAN_MCP_API_KEY}"
  tool_timeouts:
    generate_image: 10m

search:
  web:
    enabled: ${ANBAN_SEARCH_WEB_ENABLED:-false}
    provider: "${ANBAN_SEARCH_WEB_PROVIDER:-deepseek}"
  fetch:
    enabled: ${ANBAN_SEARCH_FETCH_ENABLED:-false}
    provider: "${ANBAN_SEARCH_FETCH_PROVIDER:-deepseek}"
  images:
    enabled: ${ANBAN_SEARCH_IMAGES_ENABLED:-false}
    provider: "${ANBAN_SEARCH_IMAGES_PROVIDER:-doubao}"
  providers:
    deepseek:
      api_key: "${ANBAN_DEEPSEEK_SEARCH_API_KEY:-}"
      search_endpoint: "${ANBAN_DEEPSEEK_SEARCH_ENDPOINT:-https://api.deepseek.com/v1/tools/search}"
      fetch_endpoint: "${ANBAN_DEEPSEEK_FETCH_ENDPOINT:-https://api.deepseek.com/v1/tools/fetch}"
      timeout: 30s
      max_results: 10
    doubao:
      api_key: "${ANBAN_DOUBAO_SEARCH_API_KEY:-}"
      custom_endpoint: "${ANBAN_DOUBAO_CUSTOM_SEARCH_ENDPOINT:-https://open.feedcoopapi.com/search_api/web_search}"
      global_endpoint: "${ANBAN_DOUBAO_GLOBAL_SEARCH_ENDPOINT:-https://open.feedcoopapi.com/search_api/global_search}"
      timeout: 30s
      max_results: 10

# Optional interactive Project Creator runtime. Sessions are process-local and
# are discarded when the runtime exits or its lease expires. DSH routing is
# independent from claude.profiles: changing dsh.route never changes the
# managed Claude Agent model configuration.
#
# api_key follows Claude's envs style: use ${...} to expand the value from the
# existing Server environment. No separate DSH credential-variable mapping is
# required. The Bridge starts the official DSH runtime as `dsh --profile sdk`
# and passes provider/model through initialize().
dsh:
  enabled: false
  admin_only: false
  # When enabled=true with executor=kubernetes, ANBAN_DSH_IMAGE accepts the
  # same Docker image references as Agent runtimes: a bare name, registry tag,
  # digest, or tag+digest. When DSH is disabled, its executor/image/resources
  # are ignored and do not block the Server from starting.
  executor: "${ANBAN_DSH_EXECUTOR:-container}"
  image: "${ANBAN_DSH_IMAGE:-creator-dsh-runtime:latest}"
  docker_binary: "docker"
  network: "${ANBAN_DSH_NETWORK:-creator-runtime-network}"
  project_memory_volume: "${ANBAN_DSH_PROJECT_MEMORY_VOLUME:-creator-project-memory}"
  project_memory_mount: "/workspace/project"
  # Must match claude.kubernetes.namespace so the rendered ServiceAccount and
  # RoleBinding authorize the DSH Job in the same namespace.
  kubernetes_namespace: "${ANBAN_AGENT_NAMESPACE:-anbanai-prod}"
  kubernetes_image_pull_secret: "${ANBAN_AGENT_IMAGE_PULL_SECRET:-acr-secret}"
  kubernetes_project_memory_claim: "${ANBAN_AGENT_PROJECT_MEMORY_CLAIM:-creator-project-memory}"
  kubernetes_project_memory_mount: "/workspace/project"
  server_url: "${ANBAN_DSH_SERVER_URL:-http://server:8080}"
  server_instance_id: "${HOSTNAME:-local}"
  # Kubernetes-native quantities. These are applied directly to each DSH Pod.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Legacy Docker-only resource fields; keep these for local container mode.
  cpu_cores: 1
  memory_mb: 1024
  pids_limit: 256
  # Maximum lifetime of the interactive session and its DSH runtime.
  timeout_sec: 86400
  # Close the session and runtime after this much time without a DSH heartbeat.
  idle_timeout_sec: 1800
  # ACK image pulls and NAS mounts may take time on a cold node.
  startup_timeout_sec: 180
  # Failed Kubernetes DSH pods/secrets stay this long for kubectl logs/describe.
  runtime_diagnostic_retention_seconds: 600
  bridge_command: "node"
  bridge_args: ["dist/dsh-bridge.js"]
  bridge_dir: "${ANBAN_DSH_BRIDGE_DIR:-./runtime-dsh}"
  dsh_patch: "${ANBAN_DSH_BRIDGE_PATCH:-./harness/dsh/project-creator.patch.yml}"
  mcp_url: "${ANBAN_DSH_BRIDGE_MCP_URL:-https://creator.anbanai.com/mcp}"
  route: "effective"
  routes:
    # DeepSeek's official adapter. This route uses the DSH-native
    # llm-deepseek configuration and the same existing credential as Claude.
    effective:
      provider: "deepseek-official"
      api: "deepseek-messages"
      base_url: "${ANBAN_DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}"
      api_key: "${ANBAN_DEEPSEEK_API_KEY}"
      model: "deepseek-flash"
    # Anthropic Messages through an Anthropic-compatible gateway. This route
    # uses DSH's official llm-pi-ai fields (apiKeyEnv, api, baseURL, models).
    # Select it with dsh.route: quality when this route is desired.
    quality:
      provider: "anthropic"
      api: "anthropic-messages"
      base_url: "${ANBAN_DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}"
      api_key: "${ANBAN_DEEPSEEK_API_KEY}"
      model: "deepseek-flash"

model_providers:
  # These providers are used by model_routes.server_internal and the
  # understanding routes. They do not configure image generation.
  moonshot:
    protocol: "openai_compatible"
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${MOONSHOT_API_KEY}"

  # Optional TokenPlayer chat/LLM route. This block is not required when
  # TokenPlayer is used only for image generation; configure the image route
  # under model_routes.image_generation below instead.
  # tokenplayer:
  #   protocol: "openai_compatible"
  #   base_url: "https://tokenplayer.cn/v1"
  #   api_key: "${TOKENPLAYER_API_KEY}"

  volcengine_ark:
    protocol: "openai_compatible"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key: "${VOLCENGINE_ARK_API_KEY}"

  wangcai_openai:
    protocol: "openai_compatible"
    base_url: "${WANGCAI_OPENAI_BASE_URL}"
    api_key: "${WANGCAI_OPENAI_API_KEY}"

model_routes:
  # Used only for synchronous Server-internal decisions before agent execution;
  # this is not a writing route. Multimodal routes remain separate below.
  server_internal:
    provider: "moonshot"
    model: "kimi-k2.7-code"
    timeout: 5m

  image_understanding:
    provider: "moonshot"
    model: "kimi-k2.7-code-highspeed"
    timeout: 90s
    require_usage: true

  video_understanding:
    provider: "moonshot"
    model: "kimi-k2.7-code-highspeed"
    timeout: 180s
    require_usage: true
    require_native_video: true
    max_recommended_resolution: "1920x1080"

  image_generation:
    # default_capability names a generation capability (standard or
    # professional), while min_tier is the account tier (free, pro, or
    # enterprise). The default capability must be enabled and its min_tier
    # must be free; do not set the default capability to professional.
    default_capability: "standard"
    capabilities:
      standard:
        min_tier: "free"
        alias: "标准图像"
        description: "适合日常内容配图和常规视觉创作"
        billing_sku: "image.standard"
        sort_order: 10
        provider: "volcengine_ark"
        model: "${ANBAN_IMAGE_MODEL_STANDARD:-doubao-seedream-5-0-pro-260628}"
        base_url: "https://ark.cn-beijing.volces.com/api/v3"
        api_key: "${VOLCENGINE_ARK_API_KEY}"
        # To use TokenPlayer for this image capability, replace the four
        # fields above with the following values. Image generation reads
        # provider/model/base_url/api_key directly from this route; adding a
        # tokenplayer entry under model_providers alone is not sufficient.
        # provider: "tokenplayer"
        # model: "doubao-seedream-5-0-pro-260628"
        # base_url: "${TOKENPLAYER_IMAGE_BASE_URL}"
        # api_key: "${TOKENPLAYER_API_KEY}"
        # TOKENPLAYER_IMAGE_BASE_URL must be the TokenPlayer Seedream/Ark-
        # compatible API base URL, not a chat-only endpoint.
        timeout: 5m
        enabled: true
        quality_rank: 100
        generation_features:
          quality_levels: ["auto"]
          size_presets: ["1:1:2K", "3:4:2K", "4:3:2K", "16:9:2K"]
          default_size: "1:1:2K"
          max_batch: 1
          max_reference_images: 10
          supports_reference: true
          supports_mask: false
          output_formats: ["png", "jpeg"]
          has_background: false
          has_compression: false
          watermark: true
      professional:
        min_tier: "enterprise"
        alias: "专业增强"
        description: "更适合复杂构图、细节表现和高要求视觉任务"
        billing_sku: "image.professional"
        sort_order: 20
        provider: "wangcai_openai"
        # Keep this ID aligned with billing/costs.yaml. Override it only after
        # adding the same provider/model key and verified price data there.
        # To use the production Sunburst gateway, set:
        #   ANBAN_IMAGE_MODEL_PROFESSIONAL=gpt-image-2.5-sunburst
        # or gpt-image-2.5-flare. Both models have billing entries that inherit
        # gpt-image-2-t pricing. Keep the provider/model key in billing/costs.yaml
        # aligned with this value or the Server rejects the configuration.
        # For the supplied production gateway, also set:
        #   WANGCAI_OPENAI_BASE_URL=http://18.141.196.64:18888/v1
        model: "${ANBAN_IMAGE_MODEL_PROFESSIONAL:-gpt-image-2-t}"
        base_url: "${WANGCAI_OPENAI_BASE_URL}"
        api_key: "${WANGCAI_OPENAI_API_KEY}"
        timeout: "${ANBAN_IMAGE_PROFESSIONAL_TIMEOUT:-8m}"
        # Set ANBAN_IMAGE_PROFESSIONAL_ENABLED=false while billing/provider
        # rollout is pending; disabled capabilities do not require a billing
        # model entry and cannot be selected for generation.
        enabled: ${ANBAN_IMAGE_PROFESSIONAL_ENABLED:-true}
        quality_rank: 200
        # The current checked-in provider adapter uses b64_json. Set
        # ANBAN_IMAGE_RESPONSE_FORMAT=url only when the selected gateway
        # actually returns URL images and the adapter has been verified.
        response_format: "${ANBAN_IMAGE_RESPONSE_FORMAT:-b64_json}"
        generation_features:
          quality_levels: ["auto", "low", "medium", "high"]
          size_presets: ["1:1:2K", "3:2:2K", "2:3:2K"]
          default_size: "1:1:2K"
          max_batch: 1
          max_reference_images: 16
          supports_reference: true
          supports_mask: true
          output_formats: ["png", "jpeg", "webp"]
          has_background: true
          has_compression: true
          watermark: false
# 默认关闭。内部验证并确认上游许可后才开放。配置原生 provider，不固定平台。
hypit:
  enabled: false
  runtime_profile: {}
  # 原生配置示例（启用前配置实际 Provider，bindings 可省略以使用官方自动路由）：
  # runtime_profile:
  #   format: hypit.runtime-local@1
  #   credentials:
  #     env: { use: "@hypit/credential-store-env" }
  #   endpoints:
  #     media.local: { use: "@hypit/media-local" }
  #     html.local:
  #       use: "@hypit/provider-html-local"
  #       config: { workers: 2, defaultConcurrency: 1, browserGpu: software }
  #     configured.provider:
  #       use: "@hypit/provider-hypihub"
  #       config:
  #         baseUrl: "https://hypit.ai"
  #         apiKey: { store: env, key: HYPIT_PROVIDER_TOKEN }
  #   bindings: { "@hypit/gpt-image@1#gpt-image-2": configured.provider }
  # 只在执行 bootstrap 中下发；不写入 task snapshot/产物。
  env: {}
  # env: { HYPIT_PROVIDER_TOKEN: "${HYPIT_PROVIDER_TOKEN}" }
  limits:
    max_duration_seconds: 180
    max_assets: 20
    max_asset_bytes: 268435456
    max_input_bytes: 536870912
    max_project_bytes: 2147483648
    max_expanded_bytes: 8589934592
    max_project_files: 10000
    max_video_bytes: 536870912
    timeout_minutes: 90

# Montage 视频工作流配置。
# 生产建议：
# - 保持 enabled=true。
# - claude.executor 使用 kubernetes 或 docker，并确保已发布内含固定 OpenMontage 源码与依赖的 Montage Agent 镜像。
montage:
  # 是否启用 Montage 平台。显式 false 会关闭任务/计划创建入口。
  enabled: true
  # 未指定 pipeline_key 时使用的默认 OpenMontage pipeline；必须包含在 allowed_pipelines 中。
  # 生产建议选择已验证的上游 pipeline，例如 cinematic、talking-head、screen-demo、clip-factory。
  default_pipeline: "cinematic"
  # 允许 Studio/API 选择的 pipeline 白名单。新增上游 pipeline 后先做 adapter contract test，
  # 并确认所选 Montage Agent 镜像内的 pipeline_defs/<name>.yaml 存在。
  allowed_pipelines: ["cinematic", "talking-head", "screen-demo", "clip-factory"]
  # 单个 Montage 任务允许的最长成片时长，单位秒。
  max_duration_seconds: 600
  # 单个 Montage 任务允许引用/上传的最大素材数量。
  max_assets: 20
  # Agent/Montage runner 的业务超时，单位分钟；应小于或等于 executor/pod 超时。
  timeout_minutes: 90
  # OpenMontage 运行时环境变量。key 由上游工具定义，Anban 不维护固定白名单。
  # 这里只写环境变量引用，不写明文密钥。
  # 这些值只会注入 montage 任务的 Agent/Claude SDK 进程，不会写入 MCP profile、日志或 task files。
  env:
    # FAL：FLUX/Recraft 图片、Veo/Kling/MiniMax 等视频生成 provider。
    FAL_KEY: "${MONTAGE_FAL_KEY}"
    # Pexels：免费视频/图片素材搜索。
    PEXELS_API_KEY: "${MONTAGE_PEXELS_API_KEY}"
    # Pixabay：免费视频/图片素材搜索。
    PIXABAY_API_KEY: "${MONTAGE_PIXABAY_API_KEY}"
    # Unsplash：免费图片素材搜索。
    UNSPLASH_ACCESS_KEY: "${MONTAGE_UNSPLASH_ACCESS_KEY}"
    # Suno：歌曲、配乐、instrumental 音乐生成。
    SUNO_API_KEY: "${MONTAGE_SUNO_API_KEY}"
    # ElevenLabs：高质量 TTS、音乐、音效。
    ELEVENLABS_API_KEY: "${MONTAGE_ELEVENLABS_API_KEY}"
    # OpenAI：OpenAI TTS、GPT Image 等 provider。
    OPENAI_API_KEY: "${MONTAGE_OPENAI_API_KEY}"
    # xAI：Grok 图片/视频生成 provider。
    XAI_API_KEY: "${MONTAGE_XAI_API_KEY}"
    # Google：Imagen、Google TTS 等 provider。
    GOOGLE_API_KEY: "${MONTAGE_GOOGLE_API_KEY}"
    # HeyGen：VEO、Sora、Runway、Kling 网关型视频 provider。
    HEYGEN_API_KEY: "${MONTAGE_HEYGEN_API_KEY}"
    # Runway：Runway Gen-4 direct provider。
    RUNWAY_API_KEY: "${MONTAGE_RUNWAY_API_KEY}"
    # 本地 GPU 视频生成开关。仅当 Agent 镜像和节点确实具备对应模型/驱动时开启。
    VIDEO_GEN_LOCAL_ENABLED: "${MONTAGE_VIDEO_GEN_LOCAL_ENABLED:-false}"
    # 本地 GPU 视频模型名，例如 wan2.1-1.3b、wan2.1-14b、hunyuan-1.5、ltx2-local、cogvideo-5b。
    VIDEO_GEN_LOCAL_MODEL: "${MONTAGE_VIDEO_GEN_LOCAL_MODEL:-}"
  # OpenMontage 能力层策略。Anban 只传偏好；真实 provider 可用性和选择由 OpenMontage registry/selector 判断。
  tool_policy:
    video_generation:
      preferred: ["fal", "runway", "heygen"]
    image_generation:
      preferred: ["fal", "openai", "google"]
    tts:
      preferred: ["elevenlabs", "openai", "google"]
    music:
      preferred: ["suno", "elevenlabs"]
    stock_media:
      preferred: ["pexels", "pixabay", "unsplash"]
    render:
      preferred: ["remotion"]
  # pipeline 级默认非密钥参数。Agent 会写入 montage-pipeline-defaults.json，
  # 再由 OpenMontage pipeline manifest 和 registry 解释；不要在这里放 API key。
  pipeline_defaults:
    cinematic:
      budget_usd: 2.00
      render: "remotion"
      video_generation: "auto"
      image_generation: "auto"
      tts: "auto"
      music: "auto"
    talking-head:
      budget_usd: 0.50
      transcription: "auto"
      subtitles: "burned_in"
      audio_processing: "auto"

# Experimental local-life material remix Agent. Keep disabled until the
# performance, cost, quality and commercial asset authorization checks pass.
local_life:
  enabled: ${ANBAN_LOCAL_LIFE_ENABLED:-false}

# 全自动视频剪辑使用固定的 browser-use/video-use Agent 镜像。
# ElevenLabs 密钥由 Server 持有，只会注入 video-edit 执行；未配置时任务拒绝派发。
video_edit:
  enabled: true
  max_duration_seconds: 1800
  max_assets: 20
  max_asset_bytes: 268435456
  max_total_input_bytes: 1073741824
  timeout_minutes: 90
  default_policy:
    preferences:
      quality_tier: effective
      subtitle_mode: off
    delivery_targets: [final_video, edit_decision_list, strategy, delivery_manifest, quality_evidence, content_tags]
  elevenlabs_api_key: "${VIDEO_EDIT_ELEVENLABS_API_KEY:-}"
  env: {}

# 口播精剪运行时。video-use API key 只会注入 talking-head-editor 容器。
talking_head_editor:
  enabled: ${ANBAN_TALKING_HEAD_EDITOR_ENABLED:-true}
  max_duration_seconds: 1800
  max_assets: 20
  timeout_minutes: 120
  default_policy:
    preferences:
      quality_tier: balanced
      subtitle_mode: required
      aspect_ratio: 9:16
      broll_mode: auto
      sound_mode: after_review
    delivery_targets: [final_video, editing_evidence, quality_evidence]
  video_use_api_key: "${VIDEO_USE_API_KEY:-}"
  env: {}

billing_runtime:
  config_dir: "./billing"
  admin_api_key: "${ANBAN_BILLING_ADMIN_API_KEY}"

claude:
  profiles:
    effective:
      description: "适合日常创作和批量任务，成本最低"
      provider: "deepseek"
      envs:
        ANTHROPIC_BASE_URL: "${ANBAN_DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}"
        ANTHROPIC_AUTH_TOKEN: "${ANBAN_DEEPSEEK_API_KEY}"
        ANTHROPIC_MODEL: "deepseek-flash"
        ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro"
        ANTHROPIC_DEFAULT_FABLE_MODEL: "deepseek-flash"
        ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro"
        ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-flash"
        CLAUDE_CODE_EFFORT_LEVEL: "medium"
        CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "false"
