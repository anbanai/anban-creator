        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        CLAUDE_CODE_DISABLE_AUTO_MEMORY: "0"
        CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "false"
        CLAUDE_CODE_DISABLE_THINKING: "false"
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
        CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "80"
        CLAUDE_CODE_DISABLE_1M_CONTEXT: "false"
        ENABLE_TOOL_SEARCH: "true"
        CLAUDE_CODE_SUBAGENT_MODEL: "glm-5.2"
    quality:
      description: "旗舰模型与超长上下文，适合高难度任务"
      provider: "moonshot"
      envs:
        ANTHROPIC_BASE_URL: "${ANBAN_MOONSHOT_ANTHROPIC_BASE_URL:-https://api.moonshot.cn/anthropic}"
        ANTHROPIC_AUTH_TOKEN: "${ANBAN_MOONSHOT_API_KEY}"
        ANTHROPIC_MODEL: "kimi-k3[1m]"
        ANTHROPIC_DEFAULT_OPUS_MODEL: "kimi-k3[1m]"
        ANTHROPIC_DEFAULT_FABLE_MODEL: "kimi-k3[1m]"
        ANTHROPIC_DEFAULT_SONNET_MODEL: "kimi-k3[1m]"
        ANTHROPIC_DEFAULT_HAIKU_MODEL: "kimi-k3[1m]"
        CLAUDE_CODE_EFFORT_LEVEL: "high"
        CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "true"
        CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1048576"
        CLAUDE_CODE_MAX_OUTPUT_TOKENS: "131072"
        MAX_THINKING_TOKENS: "0"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        CLAUDE_CODE_DISABLE_AUTO_MEMORY: "0"
        CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "false"
        CLAUDE_CODE_DISABLE_THINKING: "false"
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
        CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "80"
        CLAUDE_CODE_DISABLE_1M_CONTEXT: "false"
        ENABLE_TOOL_SEARCH: "true"
        CLAUDE_CODE_SUBAGENT_MODEL: "kimi-k3[1m]"
      model_usage_aliases:
        "kimi-k3[1m]": "kimi-k3"
  # Agent Job/容器访问 server MCP/API 的地址。Kubernetes 生产环境通常使用集群内 Service URL。
  agent_server_url: "${ANBAN_CLAUDE_AGENT_SERVER_URL:-https://creator-api-svc:8443}"
  # 托管 Agent 执行器类型：docker 用于单机容器；kubernetes 用于生产队列。
  executor: "${ANBAN_AGENT_EXECUTOR}"
  # 失败运行时保留多久供排查（秒），之后由 reconciler 清理。
  runtime_diagnostic_retention_seconds: 600
  # 每个 Agent 使用独立的 canonical runtime 镜像。
  runtime_images:
    # Local tags, registry tags, or immutable digests may be supplied freely.
    wechat-article: "${ANBAN_AGENT_IMAGE_WECHAT_ARTICLE:-creator-agent-wechat-article:latest}"
    wechat-picture: "${ANBAN_AGENT_IMAGE_WECHAT_PICTURE:-creator-agent-wechat-picture:latest}"
    seednote: "${ANBAN_AGENT_IMAGE_SEEDNOTE:-creator-agent-seednote:latest}"
    montage: "${ANBAN_AGENT_IMAGE_MONTAGE:-creator-agent-montage:latest}"
    viral-ip-video-editor: "${ANBAN_AGENT_IMAGE_VIRAL_IP_VIDEO_EDITOR:-creator-agent-viral-ip-video-editor:latest}"
    video-edit: "${ANBAN_AGENT_IMAGE_VIDEO_EDIT:-creator-agent-video-edit:latest}"
    talking-head-editor: "${ANBAN_AGENT_IMAGE_TALKING_HEAD_EDITOR:-creator-agent-talking-head-editor:latest}"
    moments: "${ANBAN_AGENT_IMAGE_MOMENTS:-creator-agent-moments:latest}"
    ecommerce: "${ANBAN_AGENT_IMAGE_ECOMMERCE:-creator-agent-ecommerce:latest}"
    # Optional while content autopilot is disabled; admission fails explicitly when absent.
    content-planning: "${ANBAN_AGENT_IMAGE_CONTENT_PLANNING:-}"
    profile-analysis: "${ANBAN_AGENT_IMAGE_PROFILE_ANALYSIS:-creator-agent-profile-analysis:latest}"
    feedback-analysis: "${ANBAN_AGENT_IMAGE_FEEDBACK_ANALYSIS:-creator-agent-feedback-analysis:latest}"
    whiteboard-animation: "${ANBAN_AGENT_IMAGE_WHITEBOARD_ANIMATION:-creator-agent-whiteboard-animation:latest}"
    hypit: "${ANBAN_AGENT_IMAGE_HYPIT:-creator-agent-hypit:latest}"
    local-life: "${ANBAN_AGENT_IMAGE_LOCAL_LIFE:-creator-agent-local-life:latest}"
  # Server 签发短期执行 JWT 的密钥，生产环境必须由 Secret 注入且至少 32 字节。
  execution_token_secret: "${ANBAN_AGENT_EXECUTION_TOKEN_SECRET}"
  # 是否启用 agent 沙箱隔离。生产建议 true。
  sandbox: true
  # Agent 插件目录，必须包含 agents/、skills/ 等分发资产。
  plugin_dir: "/anbanai"
  project_memory:
    root_dir: "/app/data/project-memory"
    max_project_bytes: 16777216
    max_files: 64
    max_depth: 4
    max_file_bytes: 65536
    max_preview_bytes: 262144
  docker:
    network: "${ANBAN_AGENT_DOCKER_NETWORK:-creator-runtime-network}"
    project_memory_volume: "${ANBAN_AGENT_PROJECT_MEMORY_VOLUME:-creator-project-memory}"
    cpu_cores: 2
    memory_mb: 4096
    pids_limit: 512
    timeout_sec: 3600
  kubernetes:
    # 任务失败即进入终态，不自动创建新的执行尝试；手动重试会创建新任务并重新计费。
    # Agent Job 所在命名空间。
    namespace: "${ANBAN_AGENT_NAMESPACE:-anbanai-prod}"
    # Agent Job 使用的 Kubernetes ServiceAccount。
    service_account: "${ANBAN_AGENT_SERVICE_ACCOUNT:-creator-agent-runner}"
    # 私有镜像仓库拉取 secret；公开镜像可留空。
    image_pull_secret: "${ANBAN_AGENT_IMAGE_PULL_SECRET:-acr-secret}"
    # Agent Job 中的 Go 与 Node/Claude Code TLS 客户端校验 Server 使用的签发 CA Secret，仅挂载 ca.crt。
    # 不要指向保存叶子证书 tls.crt/tls.key 的 anban-server-tls。
    server_ca_secret: "${ANBAN_AGENT_SERVER_CA_SECRET:-anban-internal-ca}"
    # 任务工作区 PVC 使用的 RWX NAS 存储类；项目记忆使用预创建的共享 PVC。
    nas_storage_class: "${ANBAN_AGENT_NAS_STORAGE_CLASS:-nas-sc-creator}"
    project_memory_claim: "${ANBAN_AGENT_PROJECT_MEMORY_CLAIM:-creator-project-memory}"
    task_workspace_size: "${ANBAN_AGENT_TASK_WORKSPACE_SIZE:-10Gi}"
    # Job 执行截止时间，单位秒。
    active_deadline_seconds: 3600
    # Agent 每 30 秒上报心跳；连续 3 分钟不可达后由 Kubernetes Reconciler 终止。
    heartbeat_timeout_seconds: 180
    # Pod 收到终止信号后的退出宽限期，也是 workload 成功后等待 Agent 完成回调的调和宽限；不控制 Agent 内部终态阶段时限。
    completion_grace_seconds: 30
    # 已完成 Job 的自动清理时间，单位秒。
    ttl_seconds_after_finished: 600
    resource_profiles:
      # 每个键必须是实际持久化的 Task.Type；没有默认资源回退。
      wechat-article:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      wechat-picture:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      seednote:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      viral-analysis:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      montage:
        requests: { cpu: "2", memory: "4Gi" }
        limits: { cpu: "4", memory: "7Gi" }
      video-edit:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      hypit:
        requests: { cpu: "4", memory: "8Gi" }
        limits: { cpu: "4", memory: "8Gi" }
      local-life:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      whiteboard-animation:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      profile-analysis:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      feedback-analysis:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      content-research:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      content-validation:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      content-script:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
  # Agent 执行日志目录。生产建议挂载持久卷，便于失败诊断和审计。
  task_log_dir: "./data/logs/tasks"

email:
