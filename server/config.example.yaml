server:
  port: 8080
  tls_cert_file: "${ANBAN_SERVER_TLS_CERT_FILE}"
  tls_key_file: "${ANBAN_SERVER_TLS_KEY_FILE}"
  host: "0.0.0.0"

logging:
  level: info

database:
  dsn: "${ANBAN_DATABASE_DSN}"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  addr: "${ANBAN_REDIS_ADDR}"
  password: "${ANBAN_REDIS_PASSWORD}"
  db: ${ANBAN_REDIS_DB:-0}

jwt:
  secret_key: "${ANBAN_JWT_SECRET_KEY}"
  access_expiry: "24h"
  refresh_expiry: "168h"

wechat:
  app_id: "${ANBAN_WECHAT_APP_ID}"
  app_secret: "${ANBAN_WECHAT_APP_SECRET}"

storage:
  provider: "oss"
  endpoint: "${ANBAN_OSS_ENDPOINT}"
  access_key_id: "${ANBAN_OSS_ACCESS_KEY_ID}"
  access_key_secret: "${ANBAN_OSS_ACCESS_KEY_SECRET}"
  bucket_name: "anbancreator"
  region: "cn-chengdu"
  # Optional public CDN/OSS custom domain only, e.g. "cdn.example.com".
  # Leave empty to return default https://{bucket}.{endpoint}/... OSS URLs.
  # Do not point this at the Studio/API domain or the /api/v1/files proxy.
  custom_domain: "${ANBAN_OSS_CDN_DOMAIN}"
  sts_role_arn: "${ANBAN_OSS_STS_ROLE_ARN}"
  sts_session_name: "anban-direct-upload"
  sts_endpoint: "${ANBAN_OSS_STS_ENDPOINT}"
  direct_upload_expires_seconds: 900
  local_data_dir: "./data/files"

mcp:
  api_key: "${ANBAN_MCP_API_KEY}"
  tool_timeouts:
    generate_image: 10m

model_providers:
  moonshot:
    protocol: "openai_compatible"
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${MOONSHOT_API_KEY}"

  volcengine_ark:
    protocol: "openai_compatible"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key: "${VOLCENGINE_ARK_API_KEY}"

  wangcai_openai:
    protocol: "openai_compatible"
    base_url: "http://18.141.196.64:18888/v1"
    api_key: "${WANGCAI_OPENAI_API_KEY}"

model_routes:
  # Used only for synchronous Server-internal decisions before agent execution;
  # this is not a writing route. Multimodal routes remain separate below.
  server_internal:
    provider: "moonshot"
    model: "kimi-k2.7-code"
    timeout: 5m

  image_understanding:
    provider: "moonshot"
    model: "kimi-k2.7-code-highspeed"
    timeout: 90s
    require_usage: true

  video_understanding:
    provider: "moonshot"
    model: "kimi-k2.7-code-highspeed"
    timeout: 180s
    require_usage: true
    require_native_video: true
    max_recommended_resolution: "1920x1080"

  image_generation:
    cover:
      provider: "volcengine_ark"
      model: "doubao-seedream-5-0-pro-260628"
      timeout: 5m
    content:
      provider: "volcengine_ark"
      model: "doubao-seedream-5-0-pro-260628"
      timeout: 5m
    designer:
      seedream:
        alias: "豆包 Seedream"
        provider: "volcengine_ark"
        model: "doubao-seedream-5-0-pro-260628"
        timeout: 5m
        enabled: true
        capabilities:
          size_presets: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3", "21:9"]
          default_size: "1:1"
          max_batch: 1
          max_reference_images: 10
          supports_reference: true
          supports_mask: false
          output_formats: ["png", "jpeg"]
          has_background: false
          has_compression: false
          watermark: true
      gpt_image_2:
        alias: "GPT Image 2"
        provider: "wangcai_openai"
        model: "gpt-image-2"
        timeout: 5m
        enabled: true
        response_format: "url"
        capabilities:
          quality_levels: ["auto", "low", "medium", "high"]
          size_presets: ["auto", "1024x1024", "1536x1024", "1024x1536"]
          default_size: "auto"
          max_batch: 10
          max_reference_images: 16
          supports_reference: true
          supports_mask: true
          output_formats: ["png", "jpeg", "webp"]
          has_background: true
          has_compression: true
          watermark: false
# Montage 视频工作流配置。
# 生产建议：
# - 保持 enabled=true。
# - execution_targets 只保留 cloud，避免生产任务依赖桌面本机执行器。
# - claude.executor 使用 kubernetes 或 docker，并确保镜像内已初始化 third_party/OpenMontage。
montage:
  # 是否启用 Montage 平台。显式 false 会关闭任务/计划创建入口。
  enabled: true
  # 上游 OpenMontage git submodule 路径。生产镜像构建时必须执行
  # `git submodule update --init --recursive third_party/OpenMontage`。
  submodule_path: "third_party/OpenMontage"
  # 未指定 pipeline_key 时使用的默认 OpenMontage pipeline；必须包含在 allowed_pipelines 中。
  # 生产建议选择已验证的上游 pipeline，例如 cinematic、talking-head、screen-demo、clip-factory。
  default_pipeline: "cinematic"
  # 允许 Studio/API 选择的 pipeline 白名单。新增上游 pipeline 后先做 adapter contract test，
  # 并确认 third_party/OpenMontage/pipeline_defs/<name>.yaml 存在。
  allowed_pipelines: ["cinematic", "talking-head", "screen-demo", "clip-factory"]
  # 单个 Montage 任务允许的最长成片时长，单位秒。
  max_duration_seconds: 600
  # 单个 Montage 任务允许引用/上传的最大素材数量。
  max_assets: 20
  # Agent/Montage runner 的业务超时，单位分钟；应小于或等于 executor/pod 超时。
  timeout_minutes: 90
  # 系统允许的执行目标。生产推荐 ["cloud"]；本地开发可临时加入 "local"。
  execution_targets: ["cloud"]
  # 系统默认执行目标。cloud 表示进入云端 Agent 队列；local 仅用于开发/桌面调试。
  default_execution_target: "cloud"
  # OpenMontage 运行时环境变量。key 由上游工具定义，Anban 不维护固定白名单。
  # 这里只写环境变量引用，不写明文密钥。
  # 这些值只会注入 montage 任务的 Agent/Claude SDK 进程，不会写入 MCP profile、日志或 task files。
  env:
    # FAL：FLUX/Recraft 图片、Veo/Kling/MiniMax 等视频生成 provider。
    FAL_KEY: "${MONTAGE_FAL_KEY}"
    # Pexels：免费视频/图片素材搜索。
    PEXELS_API_KEY: "${MONTAGE_PEXELS_API_KEY}"
    # Pixabay：免费视频/图片素材搜索。
    PIXABAY_API_KEY: "${MONTAGE_PIXABAY_API_KEY}"
    # Unsplash：免费图片素材搜索。
    UNSPLASH_ACCESS_KEY: "${MONTAGE_UNSPLASH_ACCESS_KEY}"
    # Suno：歌曲、配乐、instrumental 音乐生成。
    SUNO_API_KEY: "${MONTAGE_SUNO_API_KEY}"
    # ElevenLabs：高质量 TTS、音乐、音效。
    ELEVENLABS_API_KEY: "${MONTAGE_ELEVENLABS_API_KEY}"
    # OpenAI：OpenAI TTS、GPT Image 等 provider。
    OPENAI_API_KEY: "${MONTAGE_OPENAI_API_KEY}"
    # xAI：Grok 图片/视频生成 provider。
    XAI_API_KEY: "${MONTAGE_XAI_API_KEY}"
    # Google：Imagen、Google TTS 等 provider。
    GOOGLE_API_KEY: "${MONTAGE_GOOGLE_API_KEY}"
    # HeyGen：VEO、Sora、Runway、Kling 网关型视频 provider。
    HEYGEN_API_KEY: "${MONTAGE_HEYGEN_API_KEY}"
    # Runway：Runway Gen-4 direct provider。
    RUNWAY_API_KEY: "${MONTAGE_RUNWAY_API_KEY}"
    # 本地 GPU 视频生成开关。仅当 Agent 镜像和节点确实具备对应模型/驱动时开启。
    VIDEO_GEN_LOCAL_ENABLED: "${MONTAGE_VIDEO_GEN_LOCAL_ENABLED:-false}"
    # 本地 GPU 视频模型名，例如 wan2.1-1.3b、wan2.1-14b、hunyuan-1.5、ltx2-local、cogvideo-5b。
    VIDEO_GEN_LOCAL_MODEL: "${MONTAGE_VIDEO_GEN_LOCAL_MODEL:-}"
  # OpenMontage 能力层策略。Anban 只传偏好；真实 provider 可用性和选择由 OpenMontage registry/selector 判断。
  tool_policy:
    video_generation:
      preferred: ["fal", "runway", "heygen"]
    image_generation:
      preferred: ["fal", "openai", "google"]
    tts:
      preferred: ["elevenlabs", "openai", "google"]
    music:
      preferred: ["suno", "elevenlabs"]
    stock_media:
      preferred: ["pexels", "pixabay", "unsplash"]
    render:
      preferred: ["remotion"]
  # pipeline 级默认非密钥参数。Agent 会写入 montage-pipeline-defaults.json，
  # 再由 OpenMontage pipeline manifest 和 registry 解释；不要在这里放 API key。
  pipeline_defaults:
    cinematic:
      budget_usd: 2.00
      render: "remotion"
      video_generation: "auto"
      image_generation: "auto"
      tts: "auto"
      music: "auto"
    talking-head:
      budget_usd: 0.50
      transcription: "auto"
      subtitles: "burned_in"
      audio_processing: "auto"

billing_runtime:
  config_dir: "./billing"
  admin_api_key: "${ANBAN_BILLING_ADMIN_API_KEY}"

image_presets:
  - key: "volcengine-standard"
    display_name: "豆包 Seedream"
    provider_route: "image_generation.designer.seedream"
    min_tier: "free"
  - key: "openai-standard"
    display_name: "GPT Image 2"
    provider_route: "image_generation.designer.gpt_image_2"
    min_tier: "pro"

claude:
  providers:
    deepseek:
      protocol: "anthropic"
      base_url: "${ANBAN_DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}"
      auth_token: "${ANBAN_DEEPSEEK_API_KEY}"
    volcengine_ark:
      protocol: "anthropic"
      base_url: "${ANBAN_DOUBAO_AGENT_BASE_URL:-https://ark.cn-beijing.volces.com/api/compatible}"
      auth_token: "${ANBAN_DOUBAO_AGENT_API_KEY}"
    moonshot:
      protocol: "anthropic"
      base_url: "${ANBAN_MOONSHOT_ANTHROPIC_BASE_URL:-https://api.moonshot.cn/anthropic}"
      auth_token: "${ANBAN_MOONSHOT_API_KEY}"
    # GLM-5.2 readiness: any profile can select this provider and assign glm-5.2
    # to its model roles without coupling Zhipu to a fixed product profile.
    zhipu:
      protocol: "anthropic"
      base_url: "${ANBAN_ZHIPU_ANTHROPIC_BASE_URL:-https://open.bigmodel.cn/api/anthropic}"
      auth_token: "${ANBAN_ZHIPU_API_KEY}"
  execution_profiles:
    cost_effective:
      description: "适合日常创作和批量任务，成本最低"
      provider: "deepseek"
      models:
        default: "deepseek-v4-flash"
        opus: "deepseek-v4-pro"
        fable: "deepseek-v4-flash"
        sonnet: "deepseek-v4-pro"
        haiku: "deepseek-v4-flash"
      model_usage_aliases:
        deepseek-v4-flash: "deepseek-v4-flash"
        deepseek-v4-pro: "deepseek-v4-pro"
      claude:
        effort_level: "medium"
        max_context_tokens: 1048576
        max_output_tokens: 393216
        auto_compact_window: 1048576
    balanced:
      description: "兼顾复杂任务质量、速度和成本"
      provider: "zhipu"
      models:
        default: "glm-5.2"
        opus: "glm-5.2"
        fable: "glm-5.2"
        sonnet: "glm-5.2"
        haiku: "glm-5.2"
      model_usage_aliases:
        glm-5.2: "glm-5.2"
      claude:
        effort_level: "high"
        max_context_tokens: 1048576
        max_output_tokens: 131072
        auto_compact_window: 1048576
    maximum_quality:
      description: "旗舰模型与超长上下文，适合高难度任务"
      provider: "moonshot"
      models:
        default: "kimi-k3[1m]"
        opus: "kimi-k3[1m]"
        fable: "kimi-k3[1m]"
        sonnet: "kimi-k3[1m]"
        haiku: "kimi-k3[1m]"
      model_usage_aliases:
        kimi-k3: "kimi-k3"
        kimi-k3[1m]: "kimi-k3"
      claude:
        effort_level: "high"
        always_enable_effort: true
        max_context_tokens: 1048576
        max_output_tokens: 131072
        auto_compact_window: 1048576
        subagent_model: "kimi-k3[1m]"
  # Agent Job/容器访问 server MCP/API 的地址。Kubernetes 生产环境通常使用集群内 Service URL。
  agent_server_url: "${ANBAN_CLAUDE_AGENT_SERVER_URL:-https://creator-api-svc:8443}"
  # 托管 Agent 执行器类型：docker 用于单机容器；kubernetes 用于生产队列。
  executor: "${ANBAN_AGENT_EXECUTOR}"
  # 所有托管执行器共享同一组 canonical runtime 镜像。
  runtime_images:
    article: "${ANBAN_AGENT_IMAGE_ARTICLE}"
    seednote: "${ANBAN_AGENT_IMAGE_SEEDNOTE}"
    montage: "${ANBAN_AGENT_IMAGE_MONTAGE}"
  # Server 签发短期执行 JWT 的密钥，生产环境必须由 Secret 注入且至少 32 字节。
  execution_token_secret: "${ANBAN_AGENT_EXECUTION_TOKEN_SECRET}"
  # 是否启用 agent 沙箱隔离。生产建议 true。
  sandbox: true
  # Agent 插件目录，必须包含 agents/、skills/ 等分发资产。
  plugin_dir: "/anbanai"
  docker:
    network: "${ANBAN_AGENT_DOCKER_NETWORK:-anban-creator-network}"
    cpu_cores: 2
    memory_mb: 4096
    pids_limit: 512
    timeout_sec: 3600
  kubernetes:
    # Agent Job 所在命名空间。
    namespace: "${ANBAN_AGENT_NAMESPACE:-anbanai-prod}"
    # Agent Job 使用的 Kubernetes ServiceAccount。
    service_account: "${ANBAN_AGENT_SERVICE_ACCOUNT:-creator-agent-runner}"
    # 私有镜像仓库拉取 secret；公开镜像可留空。
    image_pull_secret: "${ANBAN_AGENT_IMAGE_PULL_SECRET}"
    # Agent Job 中的 Go 与 Node/Claude Code TLS 客户端校验 Server 使用的签发 CA Secret，仅挂载 ca.crt。
    # 不要指向保存叶子证书 tls.crt/tls.key 的 anban-server-tls。
    server_ca_secret: "${ANBAN_AGENT_SERVER_CA_SECRET:-anban-internal-ca}"
    # 项目记忆与任务工作区 PVC 使用的 RWX NAS 存储类及各自容量。
    nas_storage_class: "${ANBAN_AGENT_NAS_STORAGE_CLASS:-nas-sc-creator}"
    project_memory_size: "${ANBAN_AGENT_PROJECT_MEMORY_SIZE:-1Gi}"
    task_workspace_size: "${ANBAN_AGENT_TASK_WORKSPACE_SIZE:-10Gi}"
    # Job 执行截止时间与 agent 上报完成后的退出宽限期，单位秒。
    active_deadline_seconds: 3600
    # Agent 每 30 秒上报心跳；连续 3 分钟不可达后由 Kubernetes Reconciler 终止。
    heartbeat_timeout_seconds: 180
    completion_grace_seconds: 30
    # 已完成 Job 的自动清理时间，单位秒。
    ttl_seconds_after_finished: 600
    # Job 启动前失败时允许创建新执行尝试的次数。
    pre_start_retry_limit: 1
    resources:
      # 未配置专属档位的任务使用此默认资源。
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    resource_profiles:
      moments:
        requests: { cpu: "500m", memory: "1Gi" }
        limits: { cpu: "1", memory: "2Gi" }
      article:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      seednote:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      ecommerce:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      montage:
        requests: { cpu: "2", memory: "4Gi" }
        limits: { cpu: "4", memory: "7Gi" }
  max_turns:
    moments: 25
    # 热门内容研究、多图生成与交付需要更完整的 Agent 工具调用预算。
    seednote: 100
    article: 60
    ecommerce: 90
    # Montage pipeline 编排通常会调用多轮 MCP/文件登记，生产建议 90 起。
    montage: 90
  # Agent 执行日志目录。生产建议挂载持久卷，便于失败诊断和审计。
  task_log_dir: "./data/logs/tasks"

email:
  smtp_host: "smtp.163.com"
  smtp_port: 465
  smtp_username: "${ANBAN_SMTP_USERNAME}"
  smtp_password: "${ANBAN_SMTP_PASSWORD}"
  from_address: "${ANBAN_SMTP_FROM_ADDRESS}"
  from_name: "Anban 智能创作助手"
  code_ttl: 5m
  code_length: 6

seednote:
  base_url: "${ANBAN_SEEDNOTE_BASE_URL:-http://seednote:18060}"
  timeout: 30

ilink:
  enabled: ${ANBAN_ILINK_ENABLED:-true}
  base_url: "${ANBAN_ILINK_BASE_URL:-http://wcflink:18070}"
  timeout: 30
  poll_interval: 2
  notification_retry_max: 5
  assistant_account_id: "${ANBAN_ILINK_ASSISTANT_ACCOUNT_ID:-}"
  assistant_name: "${ANBAN_ILINK_ASSISTANT_NAME:-Anban 微信助手}"
  assistant_wechat_id: "${ANBAN_ILINK_ASSISTANT_WECHAT_ID:-}"
  assistant_qrcode_url: "${ANBAN_ILINK_ASSISTANT_QRCODE_URL:-}"

cors:
  allowed_origins:
    - "https://creator.anbanai.com"

asynq:
  concurrency: 3

invitation:
  enabled: true
  max_per_user: 10
