# 密钥仅由 Server 使用，不会下发给 Agent 或 Studio。
worldtree:
  base_url: "${ANBAN_WORLDTREE_BASE_URL:-https://www.worldtreetech.cn}"
  key: "${ANBAN_WORLDTREE_API_KEY:-}"
  timeout: 30

ilink:
  enabled: ${ANBAN_ILINK_ENABLED:-true}
  base_url: "${ANBAN_ILINK_BASE_URL:-http://sidecar-ilink:18070}"
  timeout: 30
  poll_interval: 2
  notification_retry_max: 5
  assistant_account_id: "${ANBAN_ILINK_ASSISTANT_ACCOUNT_ID:-}"
  assistant_name: "${ANBAN_ILINK_ASSISTANT_NAME:-Anban 微信助手}"
  assistant_wechat_id: "${ANBAN_ILINK_ASSISTANT_WECHAT_ID:-}"
  assistant_qrcode_url: "${ANBAN_ILINK_ASSISTANT_QRCODE_URL:-}"

cors:
  allowed_origins:
    - "https://creator.anbanai.com"

asynq:
  concurrency: 3

invitation:
  enabled: true
  max_per_user: 10
