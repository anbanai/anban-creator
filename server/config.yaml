claude:
  # Agent Job/容器访问 server MCP/API 的地址。Kubernetes 生产环境通常使用集群内 Service URL。
  agent_server_url: "${ANBAN_CLAUDE_AGENT_SERVER_URL:-https://creator-api-svc:8443}"
  # Agent 执行器类型：local 用于开发；docker 用于单机容器；kubernetes 用于生产队列。
  executor: "${ANBAN_CLAUDE_EXECUTOR:-local}"
  # 是否启用 agent 沙箱隔离。生产建议 true。
  sandbox: true
  # Agent 插件目录，必须包含 agents/、skills/ 等分发资产。
  plugin_dir: "/anbanai"
  kubernetes:
    # Agent Job 所在命名空间。
    namespace: "${ANBAN_AGENT_NAMESPACE:-anbanai-prod}"
    # Agent 镜像。生产镜像必须包含 anban agent 二进制、Claude/Codex 运行时、
    # Anban 插件资产、ffmpeg/浏览器/Node/Python 以及 third_party/OpenMontage。
    agent_image: "${ANBAN_AGENT_IMAGE}"
    # Agent Job 使用的 Kubernetes ServiceAccount。
    service_account: "${ANBAN_AGENT_SERVICE_ACCOUNT:-creator-agent-runner}"
    # 私有镜像仓库拉取 secret；公开镜像可留空。
    image_pull_secret: "${ANBAN_AGENT_IMAGE_PULL_SECRET}"
    # Agent Job 校验 Server TLS 使用的 CA Secret，仅挂载 ca.crt。
    server_ca_secret: "${ANBAN_AGENT_SERVER_CA_SECRET:-anban-server-tls}"
    # Server 签发短期执行 JWT 的密钥，生产环境必须由 Secret 注入且至少 32 字节。
    execution_token_secret: "${ANBAN_AGENT_EXECUTION_TOKEN_SECRET}"
    # 项目记忆 PVC 使用的 RWX 存储类与容量。
    memory_storage_class: "${ANBAN_AGENT_MEMORY_STORAGE_CLASS:-nas-sc-creator}"
    memory_size: "${ANBAN_AGENT_MEMORY_SIZE:-1Gi}"
    # Job 执行截止时间与 agent 上报完成后的退出宽限期，单位秒。
    active_deadline_seconds: 3600
    completion_grace_seconds: 30
    # 已完成 Job 的自动清理时间，单位秒。
    ttl_seconds_after_finished: 600
    # Job 启动前失败时允许创建新执行尝试的次数。
    pre_start_retry_limit: 1
    resources:
      # Agent Job 资源请求，影响调度保证。
      requests:
        cpu: "500m"
        memory: "1Gi"
      # Agent Job 资源上限，生产建议按任务类型和模型上下文调大内存。
      limits:
        cpu: "4"
        memory: "8Gi"
  max_turns:
    moments: 25
    viral_analysis: 30
    seednote: 50
    article: 60
    videocreator: 80
    videoeditor: 80
    ecommerce: 90
    # Montage pipeline 编排通常会调用多轮 MCP/文件登记，生产建议 90 起。
    montage: 90
  # Agent 执行日志目录。生产建议挂载持久卷，便于失败诊断和审计。
  task_log_dir: "./data/logs/tasks"
  env:
    # Claude Code/兼容模型认证 token。必须通过环境变量注入，禁止写明文密钥。
    ANTHROPIC_AUTH_TOKEN: "${CLAUDE_CODE_AUTH_TOKEN}"
    # Claude Code 兼容 API base URL。
    ANTHROPIC_BASE_URL: "https://ark.cn-beijing.volces.com/api/compatible"
    # Agent 默认模型。
    ANTHROPIC_MODEL: "doubao-seed-evolving"
    # 关闭非必要遥测流量，生产建议保持 1。
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    # 允许 Claude Code 使用项目记忆；如需完全无状态执行可改为 1。
    CLAUDE_CODE_DISABLE_AUTO_MEMORY: "0"

