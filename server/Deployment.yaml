# The Server verifies each one-shot Agent Pod with a Kubernetes TokenReview
# before allowing it to bootstrap. Keep this cluster-scoped permission in the
# same release manifest as the Server so applying this file alone is safe.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
subjects:
  - kind: ServiceAccount
    name: "${agent_service_account}"
    namespace: "${namespace}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: creator-server-tokenreview
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: creator-project-memory
  namespace: "${namespace}"
  labels:
    app: creator-server
    app.kubernetes.io/component: project-memory
  annotations:
    anban.ai/capacity-warning-threshold: "70%"
    anban.ai/capacity-critical-threshold: "85%"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas-sc-creator
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: "${namespace}"
  name: "${micro_service_name}-${version_switch}"
  labels:
    app: "${micro_service_name}"
    version: "${version_switch}"
spec:
  # Interactive sessions are process-local; keep one control-plane replica.
  replicas: 1
  selector:
    matchLabels:
      app: "${micro_service_name}"
  template:
    metadata:
      labels:
        app: "${micro_service_name}"
        version: "${version_switch}"
    spec:
      serviceAccountName: "${agent_service_account}"
      # The Server uses client-go in-cluster auth to create and reconcile
      # Claude Jobs and interactive DSH Jobs. Keep the projected token
      # explicit so an ACK admission/defaulting policy cannot disable it.
      automountServiceAccountToken: true
      initContainers:
        - name: project-memory-init
          image: "${image_repo}"
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /memory/projects
              chown 1000:1000 /memory /memory/projects
              chmod 0750 /memory /memory/projects
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - mountPath: /memory
              name: project-memory
      containers:
        - env:
            - name: "aliyun_logs_log-${micro_service_name}-${version_switch}_logstore"
              value: "${log_store}"
            - name: "aliyun_logs_log-${micro_service_name}-${version_switch}"
              value: stdout
            - name: "aliyun_logs_${micro_service_name}-${version_switch}_tags"
              value: "applog=${micro_service_name}-${version_switch}"
            - name: version_switch
              value: "${version_switch}"
            - name: TZ
              value: Asia/Shanghai
            - name: ANBAN_SEEDNOTE_BASE_URL
              value: http://sidecar-seednote:18060
            - name: ANBAN_ILINK_ENABLED
              value: "true"
            - name: ANBAN_ILINK_BASE_URL
              value: http://sidecar-ilink:18070
            # Interactive DSH sessions are launched as isolated workloads by
            # the Server; the Server image does not embed the DSH runtime.
            - name: ANBAN_AGENT_EXECUTOR
              value: kubernetes
            - name: ANBAN_CLAUDE_AGENT_SERVER_URL
              value: "https://${micro_service_name}-svc.${namespace}.svc.cluster.local:8443"
            - name: ANBAN_SERVER_TLS_CERT_FILE
              value: /var/run/secrets/anban-server-tls/tls.crt
            - name: ANBAN_SERVER_TLS_KEY_FILE
              value: /var/run/secrets/anban-server-tls/tls.key
            - name: SSL_CERT_FILE
              value: /var/run/secrets/anban-internal-ca/ca.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/anban-internal-ca/ca.crt
            - name: ANBAN_AGENT_NAMESPACE
              value: "${namespace}"
            - name: ANBAN_AGENT_IMAGE_WECHAT_ARTICLE
              value: "${wechat_article_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_WECHAT_PICTURE
              value: "${wechat_picture_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_SEEDNOTE
              value: "${seednote_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_MONTAGE
              value: "${montage_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_MOMENTS
              value: "${moments_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_ECOMMERCE
              value: "${ecommerce_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_PROFILE_ANALYSIS
              value: "${profile_analysis_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_FEEDBACK_ANALYSIS
              value: "${feedback_analysis_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_WHITEBOARD_ANIMATION
              value: "${whiteboard_animation_agent_image_repo}"
            - name: ANBAN_AGENT_IMAGE_HYPIT
              value: "${hypit_agent_image_repo}"
            - name: ANBAN_DSH_IMAGE
              value: "${dsh_image_repo}"
            - name: ANBAN_AGENT_SERVICE_ACCOUNT
              value: "${agent_service_account}"
            - name: ANBAN_AGENT_SERVER_CA_SECRET
              value: anban-internal-ca
            - name: ANBAN_AGENT_NAS_STORAGE_CLASS
              value: nas-sc-creator
            - name: ANBAN_AGENT_PROJECT_MEMORY_CLAIM
              value: creator-project-memory
            - name: ANBAN_AGENT_TASK_WORKSPACE_SIZE
              value: 10Gi
            - name: ANBAN_AGENT_EXECUTION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: anban-agent-execution-token
                  key: token-secret
            - name: ANBAN_DEEPSEEK_ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: anban-agent-profile-providers
                  key: deepseek-anthropic-base-url
            - name: ANBAN_DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anban-agent-profile-providers
                  key: deepseek-api-key
            - name: ANBAN_DEEPSEEK_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anban-agent-profile-providers
                  key: deepseek-search-api-key
                  optional: true
            - name: ANBAN_MOONSHOT_ANTHROPIC_BASE_URL
              value: https://api.moonshot.cn/anthropic
            - name: ANBAN_MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anban-agent-profile-providers
                  key: moonshot-api-key
            - name: ANBAN_ZHIPU_ANTHROPIC_BASE_URL
              value: https://open.bigmodel.cn/api/anthropic
            - name: ANBAN_ZHIPU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anban-agent-profile-providers
                  key: zhipu-api-key
            - name: ANBAN_BILLING_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anban-billing-admin-api-key
                  key: api-key
            - name: ANBAN_AGENT_IMAGE_PULL_SECRET
              value: "${imagePullSecret}"
          # Optional so existing installations can deploy with onboarding disabled.
          # The mounted config.yaml must also contain the onboarding section.
          envFrom:
            - secretRef:
                name: anban-onboarding-providers
                optional: true
          name: "${micro_service_name}-${version_switch}"
          image: "${image_repo}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "${requests_cpu}"
              memory: "${requests_memory}"
              ephemeral-storage: 2Gi
            limits:
              cpu: "${limits_cpu}"
              memory: "${limits_memory}"
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /app/data/project-memory
              name: project-memory
            - mountPath: /app/conf/config.yaml
              name: "${micro_service_name}-config"
              subPath: config.yaml
              readOnly: true
            - mountPath: /var/run/secrets/anban-server-tls
              name: anban-server-tls
              readOnly: true
            - mountPath: /var/run/secrets/anban-internal-ca
              name: anban-internal-ca
              readOnly: true
      imagePullSecrets:
        - name: "${imagePullSecret}"
      volumes:
        - name: project-memory
          persistentVolumeClaim:
            claimName: creator-project-memory
        - name: anban-server-tls
          secret:
            secretName: anban-server-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: anban-internal-ca
          secret:
            secretName: anban-internal-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: "${micro_service_name}-config"
          configMap:
            defaultMode: 420
            name: "${configmap_name}"
            items:
              - key: "${micro_service_name}.yaml"
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: "${micro_service_name}-svc"
  namespace: "${namespace}"
  labels:
    app: "${micro_service_name}-svc"
spec:
  selector:
    app: "${micro_service_name}"
    version: "${version_switch}"
  sessionAffinity: ClientIP
  ports:
    - name: https-8443
      port: 8443
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "${micro_service_name}-${version_switch}-hpa"
  namespace: "${namespace}"
  labels:
    app: "${micro_service_name}-${version_switch}-hpa"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "${micro_service_name}-${version_switch}"
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "${agent_service_account}"
  namespace: "${namespace}"
  labels:
    app: creator-agent
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: creator-agent-runner
  namespace: "${namespace}"
  labels:
    app: creator-agent
  annotations:
    anban.ai/serviceAccount: "${agent_service_account}"
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups: [""]
    resources:
      - pods/attach
    verbs:
      - create
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - list
      - create
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: creator-agent-runner
  namespace: "${namespace}"
  labels:
    app: creator-agent
subjects:
  - kind: ServiceAccount
    name: "${agent_service_account}"
    namespace: "${namespace}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: creator-agent-runner
