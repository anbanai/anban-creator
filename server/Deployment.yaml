apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${namespace}
  name: ${micro_service_name}-${version_switch}
  labels:
    app: ${micro_service_name}
    version: ${version_switch}
spec:
  replicas: ${replicas_count}
  selector:
    matchLabels:
      app: ${micro_service_name}
  template:
    metadata:
      labels:
        app: ${micro_service_name}
        version: ${version_switch}
    spec:
      serviceAccountName: creator-server
      containers:
        - env:
            - name: aliyun_logs_log-${micro_service_name}-${version_switch}_logstore
              value: ${log_store}
            - name: aliyun_logs_log-${micro_service_name}-${version_switch}
              value: stdout
            - name: aliyun_logs_${micro_service_name}-${version_switch}_tags
              value: applog=${micro_service_name}-${version_switch}
            - name: version_switch
              value: ${version_switch}
            - name: TZ
              value: Asia/Shanghai
            - name: ANBAN_SEEDNOTE_BASE_URL
              value: http://seednote:18060
            - name: ANBAN_ILINK_ENABLED
              value: "true"
            - name: ANBAN_ILINK_BASE_URL
              value: http://wcflink:18070
            - name: ANBAN_CLAUDE_EXECUTOR
              value: kubernetes
            - name: ANBAN_CLAUDE_AGENT_SERVER_URL
              value: https://${micro_service_name}-svc.${namespace}.svc.cluster.local:8443
            - name: ANBAN_SERVER_TLS_CERT_FILE
              value: /var/run/secrets/anban-server-tls/tls.crt
            - name: ANBAN_SERVER_TLS_KEY_FILE
              value: /var/run/secrets/anban-server-tls/tls.key
            - name: ANBAN_AGENT_NAMESPACE
              value: ${namespace}
            - name: ANBAN_AGENT_IMAGE
              value: ${agent_image_repo}
            - name: ANBAN_AGENT_SERVICE_ACCOUNT
              value: creator-agent-runner
            - name: ANBAN_AGENT_SERVER_CA_SECRET
              value: anban-server-tls
            - name: ANBAN_AGENT_EXECUTION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: anban-agent-execution-token
                  key: token-secret
            - name: ANBAN_AGENT_IMAGE_PULL_SECRET
              value: ${imagePullSecret}
          name: ${micro_service_name}-${version_switch}
          image: ${image_repo}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: ${requests_cpu}
              memory: ${requests_memory}
              ephemeral-storage: 2Gi
            limits:
              cpu: ${limits_cpu}
              memory: ${limits_memory}
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /app/conf
              name: ${micro_service_name}-config
            - mountPath: /var/run/secrets/anban-server-tls
              name: anban-server-tls
              readOnly: true
      imagePullSecrets:
        - name: ${imagePullSecret}
      volumes:
        - name: anban-server-tls
          secret:
            secretName: anban-server-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: ${micro_service_name}-config
          configMap:
            defaultMode: 420
            name: ${configmap_name}
            items:
              - key: ${micro_service_name}.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: ${micro_service_name}-svc
  namespace: ${namespace}
  labels:
    app: ${micro_service_name}-svc
spec:
  selector:
    app: ${micro_service_name}
  ports:
    - name: https-8443
      port: 8443
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${micro_service_name}-${version_switch}-hpa
  namespace: ${namespace}
  labels:
    app: ${micro_service_name}-${version_switch}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${micro_service_name}-${version_switch}
  minReplicas: ${min_replica}
  maxReplicas: ${max_replica}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
