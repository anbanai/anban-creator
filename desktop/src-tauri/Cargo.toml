[package]
name = "anban-creator-desktop"
version = "0.1.0"
description = "Anban Creator desktop shell — cloud data + local execution"
authors = ["Anban Creator"]
edition = "2021"
rust-version = "1.77"

# The library name is what mobile targets and the tauri build look for.
[lib]
name = "anban_creator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Prevent a second desktop instance from launching (and registering a second
# local executor) — focuses the existing window instead. Must be the first plugin.
tauri-plugin-single-instance = "2"

# Async runtime + HTTP + serialization for the local executor loop.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Faster dev builds (optional, widely used with Tauri).
[profile.dev]
incremental = true

# Smaller, optimized release bundles.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
