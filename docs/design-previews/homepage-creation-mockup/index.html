<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anban 首页效果稿 · 原布局去重版</title>
  <style>
    :root { --background:#faf9f6; --foreground:#161612; --muted:#7d7e75; --border:#e0dfd8; --primary:#a65a23; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; background:var(--background); color:var(--foreground); font:14px Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; border:0; background:none; }
    button:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
    svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .icon-definitions { position:absolute; width:0; height:0; overflow:hidden; }
    .sidebar { width:240px; position:fixed; inset:0 auto 0 0; display:flex; flex-direction:column; border-right:1px solid #dddcd5; background:#f9f8f5; padding:20px 12px 0; }
    .brand { padding:0 8px; position:relative; }
    .brand-name { font-size:20px; font-weight:650; letter-spacing:-.7px; }
    .brand-description { color:var(--muted); font-size:12px; margin-top:4px; }
    .collapse { position:absolute; right:10px; top:3px; width:34px; height:34px; display:grid; place-items:center; border-radius:8px; background:#f0efea; color:#56594e; }
    .collapse svg { width:17px; height:17px; }
    .search { display:flex; align-items:center; gap:8px; padding:0 11px; margin:18px 0 20px; min-height:40px; border:1px solid #dfded6; border-radius:8px; background:white; color:var(--muted); font-size:12px; }
    .search svg { width:15px; height:15px; }
    .search kbd { margin-left:auto; border:1px solid #deded8; border-radius:4px; font:10px inherit; padding:0 3px; color:#95968e; }
    .navigation { flex:1; overflow:auto; min-height:0; scrollbar-width:none; }
    .navigation::-webkit-scrollbar { display:none; }
    .nav-group + .nav-group { margin-top:26px; }
    .nav-label { padding:0 12px; margin:0 0 9px; color:#929287; font-size:11px; }
    .nav-item { width:100%; height:42px; padding:0 12px; display:flex; align-items:center; gap:12px; text-align:left; border-radius:8px; color:#64675c; margin-bottom:2px; }
    .nav-item.active { background:#f7eadd; color:#9d5b26; font-weight:550; }
    .nav-item:hover { background:#f0ede6; }
    .account { margin:16px -12px 0; padding:17px 24px; display:flex; align-items:center; gap:9px; border-top:1px solid #dddcd6; font-size:12px; color:#7b7c72; }
    .account-avatar { display:grid; place-items:center; background:#a1530c; color:white; width:28px; height:28px; border-radius:50%; font-size:12px; }
    .main { margin-left:240px; min-height:100dvh; }
    .workspace { max-width:1024px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:32px; }
    .hero { display:flex; align-items:center; justify-content:center; gap:24px; max-width:576px; width:100%; margin:0 auto; padding:0 8px clamp(24px,4dvh,40px); }
    .hero-avatar { width:clamp(80px,16dvh,144px); height:clamp(80px,16dvh,144px); flex-shrink:0; display:grid; place-items:center; border:1px solid var(--border); border-radius:16px; background:#f4f3ef; box-shadow:0 1px 2px #0000000d; color:#65675e; }
    .hero-avatar svg { width:48px; height:48px; stroke-width:1.9; }
    .hero-copy { min-width:0; }
    .eyebrow { margin:0; font-size:12px; color:#73776a; letter-spacing:2px; }
    h1 { margin:8px 0 0; font-size:30px; font-weight:600; line-height:1.2; letter-spacing:-.8px; white-space:nowrap; }
    .hero-description { margin:8px 0 0; color:var(--muted); font-size:14px; line-height:24px; }
    .hero-types { margin-top:12px; display:flex; align-items:center; gap:5px; }
    .agent-icon { display:inline-grid; place-items:center; width:18px; height:19px; border-radius:4px; color:#79ac7e; background:#edf5e9; border:1px solid #e3eddf; vertical-align:middle; flex-shrink:0; }
    .agent-icon svg { width:13px; height:13px; stroke-width:1.4; }
    .agent-icon.note { color:#d88f92; background:#fff0f0; border-color:#f7e5e5; }
    .rail-header { display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:12px; }
    .rail-title { font-size:14px; font-weight:500; }
    .rail-count { font-size:12px; color:var(--muted); }
    .card-scroll { height:226px; overflow:auto; scrollbar-width:none; padding:4px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:84px; gap:8px; align-content:start; }
    .card-scroll::-webkit-scrollbar { display:none; }
    .card { position:relative; border:1px solid var(--border); border-radius:12px; padding:8px; background:white; display:flex; flex-direction:column; min-width:0; box-shadow:0 1px 1px #00000002; }
    .card:hover,.card:focus-within { box-shadow:0 2px 5px #00000008; }
    .select-persona { display:flex; align-items:flex-start; gap:8px; text-align:left; padding:0; width:100%; min-width:0; flex:1; }
    .card-avatar { width:32px; height:32px; flex-shrink:0; display:grid; place-items:center; border-radius:8px; background:#f0efe9; color:#73776a; }
    .card-avatar svg { width:22px; height:22px; }
    .card-copy { flex:1; min-width:0; }
    .card-name-row { display:flex; align-items:center; gap:4px; height:20px; }
    .card-name { font-weight:600; font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .agent-extra { background:#f1f1ec; color:#7c7f72; font-size:9px; height:18px; padding:3px; border-radius:4px; flex-shrink:0; }
    .card-description { color:var(--muted); font-size:12px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-actions { display:flex; gap:8px; justify-content:flex-end; align-items:center; opacity:0; height:22px; }
    .card:hover .card-actions,.card:focus-within .card-actions { opacity:1; }
    .card-actions button { font-size:11px; color:#75796b; padding:3px 2px; }
    .create-card { border:1px dashed var(--border); background:transparent; display:flex; align-items:center; gap:9px; text-align:left; padding:10px; border-radius:12px; }
    .create-icon { width:28px; height:28px; border-radius:8px; background:#f2e9df; display:grid; place-items:center; color:#b8844d; }
    .create-title { font-size:14px; font-weight:600; line-height:20px; }
    .create-description { font-size:12px; color:var(--muted); line-height:18px; }
    .composer-area { margin-top:12px; }
    .context { display:flex; align-items:center; gap:6px; padding:8px 0; font-size:12px; color:#85887b; margin-bottom:16px; }
    .context svg { width:14px; height:14px; }
    .composer { border:1px solid #d8d6cc; border-radius:12px; background:white; padding:10px 12px 10px; }
    .composer:focus-within { border-color:#b28c62; }
    textarea { width:100%; height:96px; display:block; background:transparent; border:0; outline:none; resize:none; font-size:14px; line-height:22px; padding:0; }
    textarea::placeholder { color:#85877b; opacity:1; }
    .tools { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; min-height:36px; }
    .tools-left,.tools-right { display:flex; align-items:center; gap:8px; }
    .tools-left button { display:grid; place-items:center; color:#838879; width:22px; height:28px; padding:0; }
    .tools-left svg { width:16px; height:16px; }
    .type-select,.parameters { display:flex; align-items:center; gap:6px; font-size:13px; color:#707567; padding:6px 4px; }
    .type-select svg,.parameters svg { width:12px; height:12px; }
    .parameters { margin-left:8px; gap:4px; }
    .send { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:#d1a476; color:white; margin-left:6px; }
    .send svg { width:17px; height:17px; transform:rotate(-90deg); }
    @media (max-height:700px) and (min-width:768px) { .workspace { padding-block:12px; gap:8px; } .hero { padding-bottom:12px; } .hero-avatar { width:80px; height:80px; } h1,.hero-description,.hero-types { margin-top:4px; } }
    @media (min-width:1600px) { .card-scroll { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media (max-width:1050px) { .hero { gap:16px; } h1 { font-size:25px; } .parameters span { display:none; } }
    @media (max-width:767px) { .sidebar { display:none; } .main { margin-left:0; } .workspace { padding:24px 16px; } .hero { gap:16px; } h1 { font-size:23px; white-space:normal; } .hero-description { font-size:12px; } .hero-avatar { width:80px; height:80px; } .card-scroll { grid-template-columns:repeat(2,minmax(0,1fr)); } .card-name { font-size:12px; } .card-description { font-size:11px; } .card-actions { opacity:1; gap:4px; } .card-actions button { font-size:10px; } .parameters { margin-left:0; } }
  </style>
</head>
<body>
  <svg class="icon-definitions" aria-hidden="true"><defs>
    <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z"/><path d="m20 2 .5 1.5L22 4l-1.5.5L20 6l-.5-1.5L18 4l1.5-.5L20 2Z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="works" viewBox="0 0 24 24"><rect x="8" y="4" width="12" height="16" rx="2"/><path d="M4 7v10M12 8h4M12 12h4"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M7 15h2M13 15h2"/></symbol>
    <symbol id="bulb" viewBox="0 0 24 24"><path d="M8.5 16c0-2-3-3.5-3-6.5a6.5 6.5 0 1 1 13 0c0 3-3 4.5-3 6.5M9 17h6M9 20h6M11 23h2"/></symbol>
    <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 16-6-6L5 21"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24"><path d="M13 3c1 5-3 6-2 10 2-1 3-3 3-5 5 4 6 7 4 10-2 4-9 4-12 0C2 12 9 8 8 5c2 1 3 2 3 3 1-2 2-3 2-5Z"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path d="M4 3v18h17M9 16v-5M14 16V6M19 16V9"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M19 6V3L5 6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h15V6H5"/><path d="M20 11h-6v5h6"/><path d="M16 13.5h.1"/></symbol>
    <symbol id="plug" viewBox="0 0 24 24"><path d="m12 4 3 3M7 9l3 3m-7 9 5-5m0-9 9 9m-8-8 4-4 7 7-4 4a5 5 0 0 1-7-7Z"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-.5 3-2 .9L4 6l-2 4 2.5 1.5v2L2 15l2 4 2.5-.9 2 .9.5 3h5l.5-3 2-.9 2.5.9 2-4-2.5-1.5v-2L22 10l-2-4-2.5.9-2-.9-.5-3H9Z"/><circle cx="12" cy="12.5" r="3"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m8 4 8 8-8 8"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2l-1.5 1v2m0 3h.01"/></symbol>
    <symbol id="article" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="attach" viewBox="0 0 24 24"><path d="m8 12 7-7a4 4 0 0 1 6 6L11 21a6 6 0 0 1-8-8L13 3m-6 11 8-8a1.6 1.6 0 0 1 2 2l-8 8a1.6 1.6 0 0 1-2-2Z"/></symbol>
    <symbol id="sliders" viewBox="0 0 24 24"><path d="M3 6h7m4 0h7M3 18h11m4 0h3M10 3v6M14 15v6"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14v6ZM3 22h18"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></symbol>
  </defs></svg>
  <aside class="sidebar" aria-label="工作空间导航">
    <div class="brand"><div class="brand-name">Anban Studio</div><div class="brand-description">内容智能创作系统</div><button class="collapse" aria-label="收起侧边栏"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m8-11-3 3 3 3"/></svg></button></div>
    <button class="search"><svg><use href="#search"/></svg>搜索与快捷操作<kbd>⌘K</kbd></button>
    <nav class="navigation">
      <div class="nav-group"><p class="nav-label">工作空间</p><button class="nav-item active" aria-current="page"><svg><use href="#spark"/></svg>首页</button><button class="nav-item"><svg><use href="#user"/></svg>人设</button><button class="nav-item"><svg><use href="#works"/></svg>作品</button><button class="nav-item"><svg><use href="#calendar"/></svg>排期</button></div>
      <div class="nav-group"><p class="nav-label">管理与接入</p><button class="nav-item"><svg><use href="#wallet"/></svg>钱包</button><button class="nav-item"><svg><use href="#plug"/></svg>插件</button><button class="nav-item"><svg><use href="#settings"/></svg>设置</button></div>
      <div class="nav-group"><p class="nav-label">内容分析</p><button class="nav-item"><svg><use href="#chart"/></svg>内容分析</button><button class="nav-item"><svg><use href="#spark"/></svg>选题资产</button><button class="nav-item"><svg><use href="#image"/></svg>素材库</button><button class="nav-item"><svg><use href="#trend"/></svg>热点雷达</button></div>
    </nav>
    <div class="account"><div class="account-avatar">5</div>577717</div>
  </aside>
  <main class="main"><div class="workspace">
    <section class="hero" aria-label="当前人设">
      <div class="hero-avatar"><svg><use href="#user"/></svg></div>
      <div class="hero-copy"><p class="eyebrow">当前人设</p><h1 id="current-name">AI内容创作先锋</h1><p class="hero-description">使用当前人设，开始你的下一次创作。</p><div class="hero-types" id="current-types"><span class="agent-icon" title="公众号文章"><svg><use href="#edit"/></svg></span></div></div>
    </section>
    <section aria-label="切换人设">
      <div class="rail-header"><span class="rail-title">切换人设</span><span class="rail-count">其他 5 个人设</span></div>
      <div class="card-scroll" id="persona-grid">
        <button class="create-card"><span class="create-icon"><svg><use href="#plus"/></svg></span><span><span class="create-title">创建新人设</span><br><span class="create-description">聊一聊你的定位与风格</span></span></button>
      </div>
    </section>
    <section class="composer-area" aria-label="创作输入区">
      <div class="context"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a20 20 0 0 0 18 0M10 12v3h4v-3"/></svg>当前模式：创作模式</div>
      <div class="composer"><textarea aria-label="发送消息" placeholder="描述你想创作的内容，或告诉我你的目标..."></textarea><div class="tools"><div class="tools-left"><button aria-label="添加附件"><svg><use href="#attach"/></svg></button><button aria-label="从素材库选择"><svg style="width:12px;height:12px"><use href="#plus"/></svg></button></div><div class="tools-right"><button class="type-select"><span id="creation-type">公众号文章</span><svg><use href="#down"/></svg></button><button class="parameters"><svg><use href="#sliders"/></svg><span>性价比 / 16:9 / 标准图像</span><svg><use href="#down"/></svg></button><button class="send" aria-label="发送消息"><svg><use href="#arrow"/></svg></button></div></div></div>
    </section>
  </div></main>
  <script>
    // Visual prototype only. Switching personas changes local display, never sends requests.
    let current = { name:'AI内容创作先锋', description:'深度文章与图文内容', type:'公众号文章', count:1 };
    const alternatives = [
      { name:'词元玩家', description:'深度文章与图文内容', type:'公众号文章', count:3 },
      { name:'P90 理疗仪与 AI 甩脂仪', description:'深度文章与图文内容', type:'公众号文章', count:3 },
      { name:'星育师', description:'笔记文案与多页内容', type:'种草笔记', count:1 },
      { name:'AI自媒体创作经营', description:'深度文章与图文内容', type:'公众号文章', count:1 },
      { name:'词元玩家 TokenPlayer 公众号', description:'深度文章与图文内容', type:'公众号文章', count:1 },
    ];
    const grid = document.getElementById('persona-grid');
    function agentIcon(persona) {
      const note = persona.type === '种草笔记';
      return `<span class="agent-icon ${note ? 'note' : ''}" title="${persona.type}"><svg><use href="#${note ? 'works' : 'edit'}"/></svg></span>${persona.count > 1 ? `<span class="agent-extra">+${persona.count - 1}</span>` : ''}`;
    }
    function renderCard(card, index) {
      const persona = alternatives[index];
      card.innerHTML = `<button class="select-persona" aria-label="切换到${persona.name}"><span class="card-avatar"><svg><use href="#user"/></svg></span><span class="card-copy"><span class="card-name-row"><span class="card-name">${persona.name}</span>${agentIcon(persona)}</span><span class="card-description">${persona.description}</span></span></button><div class="card-actions"><button>创作类型</button><button>查看作品</button><button>调整人设</button></div>`;
      card.querySelector('.select-persona').addEventListener('click', () => {
        // The previous persona takes this slot so other cards do not move.
        [current, alternatives[index]] = [alternatives[index], current];
        document.getElementById('current-name').textContent = current.name;
        document.getElementById('current-types').innerHTML = agentIcon(current);
        document.getElementById('creation-type').textContent = current.type;
        renderCard(card, index);
      });
    }
    alternatives.forEach((_, index) => {
      const card = document.createElement('article');
      card.className = 'card';
      renderCard(card, index);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
