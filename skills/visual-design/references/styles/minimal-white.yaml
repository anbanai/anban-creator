name: minimal-white
english_name: Minimal White
description: 极简白色风——纯白大面积底色、严格网格对齐、极少点缀色，适合职场/商业/效率类内容
category: 商务简约 / 教程干货

colors:
  primary: "#2196F3"      # 蓝色（关键数据点亮）
  secondary: "#6B7280"    # 中灰（辅助信息）
  accent: "#1A1A2E"       # 深炭灰（主文字）
  background: "#FFFFFF"   # 纯白（大面积底色）
  text: "#1A1A2E"         # 深炭灰（正文）

background:
  type: 纯白
  texture: 无纹理，干净利落
  note: 强调内容本身，不依赖装饰

design:
  layout: 严格网格对齐，信息精炼集中，一目了然
  whitespace: 极大留白，呼吸感强，高端感
  border: 细线条分隔或无边框，纯色块
  shadow: 极轻微或无投影

prompt: |
  极简主义信息图设计，纯白(#FFFFFF)大面积底色。
  色彩：深炭灰(#1A1A2E)主文字，中灰(#6B7280)辅助信息，极少量蓝色(#2196F3)点亮关键数据。
  构图：严格网格对齐，大量留白空间，信息精炼集中，一目了然。
  质感：干净利落无纹理，纯色块和细线条分隔，强调内容本身。
  氛围：专业、简洁、高效，适合职场/商业/效率类内容。
