name: warm-paper
english_name: Warm Paper
description: 暖色纸质风——复古米黄纸张底色、手帐式随性排版、做旧质感，适合生活/文化/读书类内容
category: 文艺清新 / 美食探店

colors:
  primary: "#5C3D2E"      # 深棕（主文字和框线）
  secondary: "#D4A843"    # 金黄（装饰元素）
  accent: "#C0714F"       # 暖赤（标注重点）
  background: "#F7F0E3"   # 米黄纸张（底色）
  text: "#3D2B1F"         # 深棕（正文）

background:
  type: 旧纸张纹理
  texture: 纸张纹理可见，边缘微微泛黄做旧，像翻开一本旧笔记本
  note: 手帐风，可有手绘风箭头、圆圈标注、便签贴纸元素

design:
  layout: 手帐式随性排版，可有手绘风标注元素
  whitespace: 适中，留有手写感的空间
  border: 不规则手绘边框或无边框，做旧感
  shadow: 轻微纸张翘边阴影

prompt: |
  复古纸质文艺风信息图设计，米黄纸张(#F7F0E3)底色。
  色彩：深棕(#5C3D2E)主文字和框线，暖赤(#C0714F)标注重点，金黄(#D4A843)装饰元素。
  构图：手帐式随性排版，可有手绘风箭头、圆圈标注、便签贴纸元素。
  质感：旧纸张纹理可见，边缘微微泛黄做旧，像翻开一本旧笔记本。
  氛围：温暖、亲切、文艺怀旧，适合生活/文化/读书类内容。
