name: tech-dark
english_name: Tech Dark
description: 科技暗色风——深夜蓝背景、霓虹发光色高亮、玻璃质感卡片，适合科技/AI/编程类内容
category: 科技现代 / 数码数据

colors:
  primary: "#4A9FFF"      # 电蓝（信息高亮）
  secondary: "#00D4AA"    # 青绿（辅助高亮）
  accent: "#B366FF"       # 霓虹紫（强调点缀）
  background: "#0D1B2A"   # 暗夜蓝（主背景）
  text: "#E8F0FE"         # 冷白（正文）

background:
  type: 深色纯色 + 顶部蓝色光晕扩散
  texture: 微弱蓝色光晕，玻璃质感发光边缘
  note: 暗夜蓝大背景，发光信息区块浮于其上

design:
  layout: 深色背景上的发光信息区块，关键数据用亮色光斑突出
  whitespace: 适中，聚焦信息密度
  border: 轻微玻璃质感发光边缘，圆角
  shadow: 彩色光晕投影（蓝/青）

prompt: |
  深色科技风信息图设计，暗夜蓝(#0D1B2A)为主背景。
  色彩：电蓝(#4A9FFF)和青绿(#00D4AA)作为信息高亮，霓虹紫(#B366FF)点缀强调，冷白(#E8F0FE)文字。
  构图：深色大背景上的发光信息区块，关键数据用亮色光斑突出。
  质感：微弱蓝色光晕从顶部扩散，信息区域有轻微玻璃质感发光边缘。
  氛围：现代、专业、未来科技感，适合科技/AI/编程类内容。
