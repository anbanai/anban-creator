apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wcflink-state
  namespace: "${namespace}"
  labels:
    app: wcflink
spec:
  storageClassName: nas-sc-creator
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "${wcflink_storage_size}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wcflink
  namespace: "${namespace}"
  labels:
    app: wcflink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wcflink
  template:
    metadata:
      labels:
        app: wcflink
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: "${imagePullSecret}"
      containers:
        - name: wcflink
          image: "${wcflink_image_repo}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18070
              protocol: TCP
          env:
            - name: WCFLINK_LISTEN_ADDR
              value: ":18070"
            - name: WCFLINK_STATE_DIR
              value: "/app/state"
            - name: WCFLINK_DB_PATH
              value: "/app/state/wcf.db"
            - name: WCFLINK_LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 18070
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 18070
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: wcflink-state
              mountPath: /app/state
      volumes:
        - name: wcflink-state
          persistentVolumeClaim:
            claimName: wcflink-state
---
apiVersion: v1
kind: Service
metadata:
  name: wcflink
  namespace: "${namespace}"
  labels:
    app: wcflink
spec:
  type: ClusterIP
  selector:
    app: wcflink
  ports:
    - name: http
      port: 18070
      protocol: TCP
      targetPort: 18070
