apiVersion: v1
kind: ServiceAccount
metadata:
  name: anban-server
  namespace: ${namespace}
  labels:
    app: anban-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anban-agent-runner
  namespace: ${namespace}
  labels:
    app: anban-agent
  annotations:
    anban.ai/serviceAccount: anban-server
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anban-agent-runner
  namespace: ${namespace}
  labels:
    app: anban-agent
subjects:
  - kind: ServiceAccount
    name: anban-server
    namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anban-agent-runner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anban-agent-nas
  namespace: ${namespace}
  labels:
    app: anban-agent
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${agent_workspace_storage_size}

# The server does not mount this PVC. Agent Pods mount anban-agent-nas at
# claude.kubernetes.workspace_mount_path; the server receives final artifacts
# through direct OSS task_files manifests instead of reading NAS paths.
