apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
subjects:
  - kind: ServiceAccount
    name: ${agent_service_account}
    namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: creator-server-tokenreview

# This file is rendered into the combined ACK release by
# scripts/render-ack-server-deployment.sh. It may also be applied on its own
# when a cluster bootstrap pipeline manages cluster-scoped RBAC separately.
# Namespace-scoped Agent permissions are owned by server/Deployment.yaml,
# which the Yunxiao Server pipeline applies on every release.
# The Server and one-shot Agent Jobs share creator-project-memory. Jobs mount
# only projects/<project-id> through subPath; task workspaces remain task-scoped PVCs.
