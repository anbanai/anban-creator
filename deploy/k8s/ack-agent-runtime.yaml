apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-server
  namespace: ${namespace}
  labels:
    app: creator-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
  annotations:
    anban.ai/serviceAccount: creator-server
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
subjects:
  - kind: ServiceAccount
    name: creator-server
    namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: creator-agent-runner

# The server does not mount NAS. Agent Pods mount the existing NAS-backed PVC
# configured by ANBAN_AGENT_WORKSPACE_PVC, currently anban-creator in
# namespace anbanai-prod. Final artifacts are reported through direct OSS
# task_files manifests instead of server-side NAS reads.
