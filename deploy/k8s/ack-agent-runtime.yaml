apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-server
  namespace: ${namespace}
  labels:
    app: creator-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
  annotations:
    anban.ai/serviceAccount: creator-server
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - create
      - delete
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: creator-server-tokenreview
  labels:
    app: creator-server
subjects:
  - kind: ServiceAccount
    name: creator-server
    namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: creator-server-tokenreview
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: creator-agent-runner
  namespace: ${namespace}
  labels:
    app: creator-agent
subjects:
  - kind: ServiceAccount
    name: creator-server
    namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: creator-agent-runner

# The server does not mount NAS. One-shot Agent Jobs mount a project-scoped
# memory PVC and a task-scoped workspace PVC, then publish result artifacts to OSS.
