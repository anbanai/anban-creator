apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seednote-data
  namespace: "${namespace}"
  labels:
    app: seednote
spec:
  storageClassName: nas-sc-creator
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "${seednote_storage_size}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seednote
  namespace: "${namespace}"
  labels:
    app: seednote
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seednote
  template:
    metadata:
      labels:
        app: seednote
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: "${imagePullSecret}"
      containers:
        - name: seednote
          image: "${seednote_image_repo}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18060
              protocol: TCP
          env:
            - name: COOKIES_PATH
              value: "/app/data/cookies.json"
            - name: HOME
              value: "/app/data/home"
            - name: XDG_CACHE_HOME
              value: "/app/cache"
            - name: XDG_CONFIG_HOME
              value: "/app/data/config"
          readinessProbe:
            httpGet:
              path: /health
              port: 18060
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 18060
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: seednote-data
              mountPath: /app/data
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: seednote-data
          persistentVolumeClaim:
            claimName: seednote-data
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seednote
  namespace: "${namespace}"
  labels:
    app: seednote
spec:
  type: ClusterIP
  selector:
    app: seednote
  ports:
    - name: http
      port: 18060
      protocol: TCP
      targetPort: 18060
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seednote-server-only
  namespace: "${namespace}"
  labels:
    app: seednote
spec:
  podSelector:
    matchLabels:
      app: seednote
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: "${server_app_label}"
      ports:
        - protocol: TCP
          port: 18060
