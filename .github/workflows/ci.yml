name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build static Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/anban-creator-server ./server

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc -b

      - name: Test
        run: bun run test

  dsh-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install DSH plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check DSH plugin
        run: pnpm run check

  dsh-plugin-portability:
    name: DSH plugin portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install locked DSH plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Run portable profile command tests
        run: pnpm exec vitest run dsh/tests/profile-smoke.test.ts --testNamePattern "portable profile-smoke commands"

      - name: Execute the Windows pnpm.cmd probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (pnpm.cmd --version).Trim()
          if ($version -ne "11.19.0") {
            throw "pnpm.cmd version $version does not match 11.19.0"
          }

      - name: Run the official public Desktop runtime fixture
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: pnpm exec vitest run dsh/tests/profile-smoke.test.ts --testNamePattern "honors the pinned DSH Desktop public-runtime contract"
