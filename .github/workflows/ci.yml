name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build static Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/anban-creator-server ./server

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc -b

      - name: Test
        run: bun run test

  dsh-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install DSH plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check DSH plugin
        run: pnpm run check

      - name: Pack exact DSH Desktop acceptance artifact
        run: |
          node -e "require('node:fs').mkdirSync('../release/dsh',{recursive:true})"
          pnpm pack --json --pack-destination ../release/dsh > ../release/dsh/pack.json
          node ../scripts/dsh-verify-pack.mjs ../release/dsh/pack.json 4.1.18

      - name: Upload exact DSH Desktop acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anban-dsh-plugin
          path: release/dsh/anban-dsh-plugin-4.1.18.tgz
          if-no-files-found: error
          retention-days: 1

  dsh-plugin-portability:
    name: Packaged DSH Desktop acceptance (${{ matrix.os }})
    needs: dsh-plugin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Checkout pinned DSH Desktop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anywhere-labs/deepseek-harness-desktop
          ref: 4f68147091e585aaa1d815f99d30a657b3842d7c
          path: _dsh-desktop
          submodules: recursive

      - name: Verify pinned DSH Desktop commit
        run: node -e "const {execFileSync}=require('node:child_process'); const sha=execFileSync('git',['rev-parse','HEAD'],{cwd:'_dsh-desktop',encoding:'utf8'}).trim(); if(sha!=='4f68147091e585aaa1d815f99d30a657b3842d7c') process.exit(1)"

      - name: Download exact DSH Desktop acceptance artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anban-dsh-plugin
          path: release/dsh

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Run Desktop supervisor acceptance tests
        run: node --test scripts/dsh-process-supervisor.test.mjs scripts/dsh-desktop-acceptance.test.mjs

      - name: Install locked DSH plugin dependencies
        working-directory: plugins
        run: pnpm install --frozen-lockfile

      - name: Install pinned DSH Desktop dependencies
        working-directory: _dsh-desktop
        run: corepack yarn install --immutable

      - name: Build unsigned packaged DSH Desktop
        working-directory: _dsh-desktop
        run: corepack yarn package:dir

      - name: Install exact plugin through public DSH
        env:
          DSH_DESKTOP_ROOT: ${{ github.workspace }}/_dsh-desktop
          DSH_HOME: ${{ runner.temp }}/anban-dsh-desktop-home
          DSH_PLUGIN_TARBALL: ${{ github.workspace }}/release/dsh/anban-dsh-plugin-4.1.18.tgz
        run: node scripts/dsh-desktop-acceptance.mjs install anban-dsh-plugin

      - name: Launch packaged DSH Desktop application
        env:
          DSH_DESKTOP_ROOT: ${{ github.workspace }}/_dsh-desktop
          DSH_DESKTOP_STATE_DIR: ${{ runner.temp }}/anban-dsh-desktop-state
          DSH_HOME: ${{ runner.temp }}/anban-dsh-desktop-home
        run: node scripts/dsh-desktop-acceptance.mjs launch

      - name: Validate packaged Desktop profile exports and Skill catalogs
        env:
          DSH_HOME: ${{ runner.temp }}/anban-dsh-desktop-home
        run: node plugins/dsh/scripts/smoke-profile.mjs --existing-profile desktop 4.1.18

      - name: Run portable profile command tests
        working-directory: plugins
        run: pnpm exec vitest run dsh/tests/profile-smoke.test.ts --testNamePattern "portable profile-smoke commands"

      - name: Execute the Windows cmd shim test
        working-directory: plugins
        run: pnpm exec vitest run dsh/tests/profile-smoke.test.ts --testNamePattern "executes a cmd shim with spaces and metacharacters through cross-spawn"
