name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Run tests
        run: go test -v ./...

      - name: Set version
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          mkdir -p bin

      - name: Pack DSH plugin
        working-directory: plugins
        run: pnpm install --frozen-lockfile && pnpm pack --pack-destination ../bin

      - name: Build server binaries and Agent package
        run: |
          mkdir -p bin

          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-linux-amd64 ./server
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-creator-server-linux-arm64 ./server
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-darwin-amd64 ./server
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-creator-server-darwin-arm64 ./server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-windows-amd64.exe ./server

          cd agent-ts
          npm ci
          npm run typecheck
          npm run test
          npm run build
          cd ..
          tar -czf bin/anban-agent-runtime-${{ steps.version.outputs.VERSION }}.tar.gz \
            -C agent-ts package.json package-lock.json dist

          chmod +x bin/anban-creator-server-linux-* bin/anban-creator-server-darwin-* 2>/dev/null || true
          echo "${{ github.ref_name }}" > bin/version.txt

      - name: Show binary sizes
        run: ls -lh bin/

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/anban-creator-server-linux-amd64
            bin/anban-creator-server-linux-arm64
            bin/anban-creator-server-darwin-amd64
            bin/anban-creator-server-darwin-arm64
            bin/anban-creator-server-windows-amd64.exe
            bin/anban-agent-runtime-*.tar.gz
            bin/anban-dsh-plugin-*.tgz
            bin/version.txt
            bin/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
