name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build server and agent for all platforms
        run: |
          mkdir -p bin

          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-linux-amd64 ./server
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-creator-server-linux-arm64 ./server
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-darwin-amd64 ./server
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-creator-server-darwin-arm64 ./server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-creator-server-windows-amd64.exe ./server

          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-linux-amd64 ./agent
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-linux-arm64 ./agent
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-darwin-amd64 ./agent
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o bin/anban-darwin-arm64 ./agent
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/anban-windows-amd64.exe ./agent

          chmod +x bin/*-linux* bin/*-darwin* 2>/dev/null || true
          echo "${{ github.ref_name }}" > bin/version.txt

      - name: Show binary sizes
        run: ls -lh bin/

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/anban-creator-server-linux-amd64
            bin/anban-creator-server-linux-arm64
            bin/anban-creator-server-darwin-amd64
            bin/anban-creator-server-darwin-arm64
            bin/anban-creator-server-windows-amd64.exe
            bin/anban-linux-amd64
            bin/anban-linux-arm64
            bin/anban-darwin-amd64
            bin/anban-darwin-arm64
            bin/anban-windows-amd64.exe
            bin/version.txt
            bin/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
