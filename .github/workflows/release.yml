name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          LDFLAGS: "-s -w -X main.version=${{ steps.version.outputs.VERSION }}"
        run: |
          mkdir -p bin

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/wechatwriter-linux-amd64 ./app
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/wechatwriter-linux-arm64 ./app
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/wechatwriter-darwin-amd64 ./app
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/wechatwriter-darwin-arm64 ./app
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/wechatwriter-windows-amd64.exe ./app

          chmod +x bin/*-linux* bin/*-darwin* 2>/dev/null || true
          echo "${{ github.ref_name }}" > bin/version.txt

      - name: Show binary sizes
        run: ls -lh bin/

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/wechatwriter-linux-amd64
            bin/wechatwriter-linux-arm64
            bin/wechatwriter-darwin-amd64
            bin/wechatwriter-darwin-arm64
            bin/wechatwriter-windows-amd64.exe
            bin/version.txt
            bin/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
