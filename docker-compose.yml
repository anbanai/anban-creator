name: anban-creator

services:
  mysql:
    image: mysql:8.0
    container_name: anban-creator-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-anban_creator_dev}
      MYSQL_DATABASE: anban_creator
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anban-creator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seednote:
    image: xpzouying/xiaohongshu-mcp
    # The upstream image publishes an amd64 manifest only. On arm64 hosts
    # (Apple Silicon) the pull fails with "no matching manifest for
    # linux/arm64/v8". Force amd64 and run under Docker Desktop's QEMU/Rosetta
    # emulation. It's an MCP sidecar, so the emulation overhead is acceptable.
    platform: linux/amd64
    container_name: anban-creator-seednote
    restart: unless-stopped
    ports:
      - "18060:18060"
    volumes:
      - ./data/seednote:/app/data
    environment:
      ROD_BROWSER_BIN: /usr/bin/google-chrome
      COOKIES_PATH: /app/data/cookies.json
    networks:
      - anban-creator-network
    healthcheck:
      # GET, not --spider (HEAD): this image returns 404 for HEAD /health but
      # 200 for GET /health, so a HEAD-based probe falsely marks it unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:18060/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # wcfLink — WeChat bot sidecar (iLink channel). Built from the upstream
  # GitHub project (no official image). Holds logged-in WeChat sessions server-side;
  # Studio drives QR login, the server polls events for commands and pushes
  # task notifications via send-text.
  wcflink:
    build:
      context: .
      dockerfile: docker/wcflink.Dockerfile
      args:
        WCFLINK_REF: refs/tags/v0.1.0
        WCFLINK_COMMIT: fb0999b81043c91e8fddb780eb2ecf03f1f8588f
    image: anban-creator-wcflink:latest
    # Force build-only: this image is produced from the upstream wcfLink source and
    # has no registry artifact. Without this, Compose probes Docker Hub for the
    # (nonexistent) anban-creator-wcflink image and aborts on a transient registry
    # EOF instead of falling back to the Dockerfile build.
    pull_policy: build
    container_name: anban-creator-wcflink
    restart: unless-stopped
    ports:
      # Loopback-only: wcfLink's HTTP API is unauthenticated — anyone who can
      # reach :18070 can start logins, read every account and inbound event, and
      # send messages as any logged-in user. The server reaches it over the
      # compose network via http://wcflink:18070; this host binding exists only
      # for local debugging (curl localhost:18070). Bind to 127.0.0.1 so the
      # unauthenticated API is not exposed on the LAN.
      - "127.0.0.1:18070:18070"
    volumes:
      - ./data/wcflink:/app/state
    environment:
      WCFLINK_LISTEN_ADDR: ":18070"
      WCFLINK_STATE_DIR: "/app/state"
      WCFLINK_DB_PATH: "/app/state/wcf.db"
      WCFLINK_LOG_LEVEL: "info"
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18070/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: agent service disabled — server now uses local executor (Claude CLI subprocess).
  # Uncomment only if you need Docker executor mode (separate agent containers).
  # agent:
  #   build:
  #     context: .
  #     dockerfile: agent/Dockerfile
  #   image: anban-creator-agent:latest
  #   container_name: anban-creator-agent
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/workspace:/workspace
  #   networks:
  #     - anban-creator-network
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: anban-creator-server:latest
    container_name: anban-creator-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      wcflink:
        condition: service_started
    environment:
      ANBAN_DATABASE_DSN: "root:${MYSQL_ROOT_PASSWORD:-anban_creator_dev}@tcp(mysql:3306)/anban_creator?charset=utf8mb4&parseTime=True&loc=Local"
      ANBAN_REDIS_ADDR: "redis:6379"
      ANBAN_CLAUDE_DOCKER_WORKSPACE_DIR: "/app/data/workspace"
      # ilink WeChat assistant channel. Uses the compose service name, not localhost.
      ANBAN_ILINK_ENABLED: "true"
      ANBAN_ILINK_BASE_URL: "http://wcflink:18070"
    volumes:
      - ./server/config.yaml:/app/conf/config.yaml:ro
      - ./data/files:/app/data/files
      - ./data/logs:/app/data/logs
      - ./data/workspace:/app/data/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - anban-creator-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Studio frontend. Builds the SPA inside the image (dist is gitignored), serves
  # it with nginx, and reverse-proxies /api (+ /ws) to the backend service. The
  # web build's axios baseURL is same-origin /api/v1, so the same nginx origin
  # serves both static assets and the proxied API — access via http://localhost:8081.
  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    image: anban-creator-studio:latest
    # Local-build-only image (no registry artifact). Without this compose probes
    # Docker Hub for anban-creator-studio and may abort on a registry hiccup instead
    # of building — same rationale as the wcflink service above.
    pull_policy: build
    container_name: anban-creator-studio
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_started
    environment:
      BACKEND_HOST: server
    networks:
      - anban-creator-network

networks:
  anban-creator-network:
    driver: bridge
