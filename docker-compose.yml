version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: anbanwriter-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-anbanwriter_dev}
      MYSQL_DATABASE: anbanwriter
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - anbanwriter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anbanwriter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - anbanwriter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  anbanwriter-network:
    driver: bridge
