name: anban-creator

services:
  mysql:
    image: mysql:latest
    container_name: anban-creator-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-anban_creator_dev}
      MYSQL_DATABASE: anban_creator
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: anban-creator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # iLink — WeChat bot sidecar. Built from the upstream
  # GitHub project (no official image). Holds logged-in WeChat sessions server-side;
  # Studio drives QR login, the server polls events for commands and pushes
  # task notifications via send-text.
  sidecar-ilink:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sidecar-ilink
      no_cache: true
      args:
        ILINK_REF: master
    image: anban-creator-sidecar-ilink:latest
    # Force build-only: this image is produced from upstream source and
    # has no registry artifact. Without this, Compose probes Docker Hub for the
    # (nonexistent) local image and aborts on a transient registry
    # EOF instead of falling back to the Dockerfile build.
    pull_policy: build
    container_name: anban-creator-sidecar-ilink
    restart: unless-stopped
    ports:
      # Loopback-only: the iLink HTTP API is unauthenticated — anyone who can
      # reach :18070 can start logins, read every account and inbound event, and
      # send messages as any logged-in user. The server reaches it over the
      # compose network via http://sidecar-ilink:18070; this host binding exists only
      # for local debugging (curl localhost:18070). Bind to 127.0.0.1 so the
      # unauthenticated API is not exposed on the LAN.
      - "127.0.0.1:18070:18070"
    volumes:
      - ./data/sidecar-ilink:/app/state
    environment:
      WCFLINK_LISTEN_ADDR: ":18070"
      WCFLINK_STATE_DIR: "/app/state"
      WCFLINK_DB_PATH: "/app/state/wcf.db"
      WCFLINK_LOG_LEVEL: "info"
    networks:
      - anban-creator-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18070/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    image: anban-creator-server:latest
    container_name: anban-creator-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar-ilink:
        condition: service_started
    # The Server reads /app/conf/config.yaml, mounted from the gitignored
    # server/config.yaml. Kubernetes injects ${...} placeholders from Secrets;
    # Compose only supplies service discovery and the local Docker executor.
    # Do not restate server/config.yaml defaults here.
    environment:
      ANBAN_DATABASE_DSN: "root:${MYSQL_ROOT_PASSWORD:-anban_creator_dev}@tcp(mysql:3306)/anban_creator?charset=utf8mb4&parseTime=True&loc=Local"
      ANBAN_REDIS_ADDR: "redis:6379"
      ANBAN_DSH_BRIDGE_DIR: "/app/runtime-dsh"
      ANBAN_DSH_BRIDGE_PATCH: "/app/harness/dsh/project-creator.patch.yml"
      ANBAN_DSH_BRIDGE_MCP_URL: "http://127.0.0.1:8080/mcp"
      ANBAN_CLAUDE_AGENT_SERVER_URL: "http://server:8080"
      ANBAN_AGENT_EXECUTOR: "docker"
      # ilink WeChat assistant channel. Uses the compose service name, not localhost.
      ANBAN_ILINK_ENABLED: "true"
      ANBAN_ILINK_BASE_URL: "http://sidecar-ilink:18070"
    volumes:
      - ./server/config.yaml:/app/conf/config.yaml:ro
      - ./data/files:/app/data/files
      - ./data/logs:/app/data/logs
      - creator-project-memory:/app/data/project-memory
      - /var/run/docker.sock:/var/run/docker.sock
    # make docker-up resolves this from the host socket. Direct Compose users
    # can export DOCKER_GID=$(stat -L -c '%g' /var/run/docker.sock) on Linux.
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - anban-creator-network
      - creator-runtime-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Studio frontend. Builds the SPA inside the image (dist is gitignored), serves
  # it with nginx, and reverse-proxies /api (+ /ws) to the backend service. The
  # web build's axios baseURL is same-origin /api/v1, so the same nginx origin
  # serves both static assets and the proxied API — access via http://localhost:8081.
  studio:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.studio
      args:
        VITE_API_BASE_URL: /api/v1
    image: anban-creator-studio:latest
    # Local-build-only image (no registry artifact). Without this compose probes
    # Docker Hub for anban-creator-studio and may abort on a registry hiccup instead
    # of building — same rationale as the sidecar-ilink service above.
    pull_policy: build
    container_name: anban-creator-studio
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_started
    environment:
      BACKEND_HOST: server
    networks:
      - anban-creator-network

networks:
  anban-creator-network:
    name: anban-creator-network
    driver: bridge
  creator-runtime-network:
    name: creator-runtime-network
    driver: bridge

volumes:
  creator-project-memory:
    name: creator-project-memory
