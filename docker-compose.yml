version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: abwriter-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-abwriter_dev}
      MYSQL_DATABASE: abwriter
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - abwriter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abwriter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - abwriter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: abwriter-agent:latest
    container_name: abwriter
    restart: unless-stopped
    volumes:
      - ./data/workspace:/workspace
    networks:
      - abwriter-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  abwriter-network:
    driver: bridge
