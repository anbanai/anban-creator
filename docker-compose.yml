version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: abwriter-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-abwriter_dev}
      MYSQL_DATABASE: abwriter
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - abwriter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abwriter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - abwriter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: agent service disabled — server now uses local executor (Claude CLI subprocess).
  # Uncomment only if you need Docker executor mode (separate agent containers).
  # agent:
  #   build:
  #     context: .
  #     dockerfile: agent/Dockerfile
  #   image: abwriter-agent:latest
  #   container_name: abwriter-agent
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/workspace:/workspace
  #   networks:
  #     - abwriter-network
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: abwriter-server:latest
    container_name: abwriter-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ANBAN_SERVER_DATABASE_DSN: "root:${MYSQL_ROOT_PASSWORD:-abwriter_dev}@tcp(mysql:3306)/abwriter?charset=utf8mb4&parseTime=True&loc=Local"
      ANBAN_SERVER_REDIS_ADDR: "redis:6379"
      ANBAN_SERVER_CLAUDE_DOCKER_WORKSPACE_DIR: "/app/data/workspace"
    volumes:
      - ./server/config.yaml:/app/config.yaml:ro
      - ./data/files:/app/data/files
      - ./data/logs:/app/data/logs
      - ./data/workspace:/app/data/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - abwriter-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  abwriter-network:
    driver: bridge
